    </div>
    <div class="roadmap-grid" id="roadmapGrid"></div>
    ${track==='es' ? `<div class="conj-banner">
      <div><h3>🎯 Conjugation Drills</h3><p>Practica formas verbales al azar — elige el tiempo y el tipo de verbo (regulares, con cambio de raíz, irregulares) para una sesión rápida.</p></div>
      <button class="secondary-btn" data-nav="conj:setup">Practicar →</button>
    </div>` : ''}
    <div class="netlify-note">${cfg.netlifyNote}</div>
  </div>`;
  const grid = document.getElementById('roadmapGrid');
  const groups = {};
  cfg.levels.forEach(l=>groups[l]=[]);
  cfg.units.forEach(u=>groups[u.level].push(u));
  let html='';
  cfg.levels.forEach(level=>{
    html += `<div class="level-card"><h3 class="${track==='zh'?'zh':''}"><span class="tag">${level}</span> ${levelLabel(track,level).split(/[—-]/).slice(1).join('-').trim()}</h3>`;
    groups[level].forEach(u=>{
      const done = isUnitDone(track,u.id);
      html += `<div class="unit-row ${done?'status-done':''}">
        <button class="${track==='zh'?'zh':''}" data-nav="unit:${u.id}">${u.num}. ${u.title}</button>
        <span class="status">${done?cfg.doneLabel:(()=>{ const r=getProg(track)[u.id]; return (r&&r.attempts&&r.total) ? `${track==='es'?'Mejor':'Best'} ${Math.round(r.best/r.total*100)}% · ${track==='es'?'meta':'need'} ${UNIT_PASS}%` : cfg.notStartedLabel; })()}</span>
      </div>`;
    });
    const lastNum = groups[level][groups[level].length-1].num;
    const test = cfg.tests.find(t=>t.afterUnit===lastNum);
    if(test){
      const r = getTestResult(track,test.id);
      html += `<div class="test-row">
        <span>🏁 ${test.title}</span>
        <button data-nav="test:${test.id}">${cfg.startBtnLabel(r||{done:false})}</button>
      </div>`;
    }
    html += `</div>`;
  });
  grid.innerHTML = html;
  attachNavHandlers();
}

function renderUnitLesson(){
  const track = state.track; const cfg = TRACKS[track];
  const u = cfg.units.find(x=>x.id===state.unitId);
  const cards = u.lessonCards;
  const i = state.cardIndex;
  const c = cards[i];
  const dots = cards.map((_,idx)=>`<i class="${idx===i?'on':''}"></i>`).join('');
  const zhCls = track==='zh' ? 'zh' : '';
  root.innerHTML = `
  <div class="view">
    <div class="crumb"><button data-nav="track:${track}">${track==='es'?'Inicio':'Home'}</button> <span>›</span> <span>${levelLabel(track,u.level)}</span></div>
    <span class="unit-tag">${track==='es'?'Unidad':'Unit'} ${u.num} · ${i+1}/${cards.length}</span>
    <h1 class="${zhCls}" style="font-size:1.5rem;">${u.title}</h1>
    <div class="card-dots">${dots}</div>
    <div class="lesson-card ${zhCls}">
      <h2 class="${zhCls}">${c.h}</h2>
      ${c.body}
      ${(track==='es' && c.bodyEn) ? `<div class="en-block"><span class="en-label">In English</span><h3>${c.hEn}</h3>${c.bodyEn}</div>` : ''}
    </div>
    <div class="card-nav">
      <button class="secondary-btn" id="prevCard" ${i===0?'disabled':''}>← ${track==='es'?'Anterior':'Back'}</button>
      ${i < cards.length-1
        ? `<button class="primary-btn" id="nextCard">${track==='es'?'Siguiente':'Next'} →</button>`
        : `<button class="primary-btn" id="startPractice">${cfg.practiceLabelFn(UNIT_QUIZ_LEN)}</button>`}
    </div>
  </div>`;
  document.getElementById('prevCard').addEventListener('click', ()=>{ if(state.cardIndex>0){ state.cardIndex--; renderUnitLesson(); } });
  const nextBtn = document.getElementById('nextCard');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ state.cardIndex++; renderUnitLesson(); });
  const startBtn = document.getElementById('startPractice');
  if(startBtn) startBtn.addEventListener('click', ()=>{ state.mode='practice'; state.qIndex=0; state.answers=[]; state.quiz=buildUnitQuiz(track,u); renderUnitPractice(); });
  attachNavHandlers();
}

function reviewListHtml(track, items, onlyMissed){
  const cfg = TRACKS[track]; const zhCls = track==='zh' ? 'zh' : '';
  return items.map((it,i)=>{
    const q = it.q, a = it.a;
    if(onlyMissed && a.correct) return '';
    return `<div class="review-item ${zhCls}"><div class="rq">${i+1}. ${q.q}</div>
      <div class="ra ${a.correct?'right':'wrong'}">${a.correct?'✓':'✗'} ${cfg.yourAnswer} ${q.options[a.picked]}</div>
      ${!a.correct?`<div class="ra right">${cfg.correctLabel} ${q.options[q.correct]}</div>`:''}
      <div class="ra" style="margin-top:.2rem;">${q.explain}</div>
    </div>`;
  }).join('');
}
function renderQuestionCard(track, q, qIndex, total, crumbHtml, onNext){
  const cfg = TRACKS[track]; const zhCls = track==='zh' ? 'zh' : '';
  root.innerHTML = `
  <div class="view">
    <div class="crumb">${crumbHtml}</div>
    <div class="progress-line"><div class="bar"><i style="width:${(qIndex/total)*100}%"></i></div><span>${qIndex+1} / ${total}</span></div>
    <div class="q-card">
      <div class="q-prompt ${zhCls}">${q.q}</div>
      <div id="optsWrap"></div>
      <div id="explainWrap"></div>
      <div class="q-nav"><span></span><button class="primary-btn" id="nextBtn" style="display:none;">${track==='es'?'Siguiente':'Next'} →</button></div>
    </div>
  </div>`;
  const optsWrap = document.getElementById('optsWrap');
  q.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt '+zhCls; b.textContent = opt;
    b.addEventListener('click', ()=>{
      if(b.dataset.locked) return;
      [...optsWrap.children].forEach(c=>{c.dataset.locked='1'; c.disabled=true;});
      const isCorrect = i===q.correct;
      b.classList.add(isCorrect?'correct':'incorrect');
      if(!isCorrect) optsWrap.children[q.correct].classList.add('correct');
      document.getElementById('explainWrap').innerHTML = `<div class="explain ${isCorrect?'ok':'no'} ${zhCls}">${isCorrect?cfg.correctFeedback:cfg.incorrectFeedback}${q.explain}</div>`;
      document.getElementById('nextBtn').style.display='inline-block';
      state.answers.push({correct:isCorrect, picked:i});
    });
    optsWrap.appendChild(b);
  });
  document.getElementById('nextBtn').addEventListener('click', onNext);
  attachNavHandlers();
}

function renderUnitPractice(){
  const track = state.track; const cfg = TRACKS[track];
  const u = cfg.units.find(x=>x.id===state.unitId);
  if(!state.quiz) state.quiz = buildUnitQuiz(track, u);
  const quiz = state.quiz; const total = quiz.length;
  if(state.qIndex >= total){
    const correctCount = state.answers.filter(a=>a.correct).length;
    const pct = Math.round((correctCount/total)*100);
    const passed = pct >= UNIT_PASS;
    if(!state.saved){
      state.saved = true;
      saveUnitResult(track, u.id, correctCount, total, passed);
      markSeen(track, quiz); saveSeen();
    }
    renderNav();
    const items = quiz.map((q,i)=>({q, a:state.answers[i]}));
    const missed = reviewListHtml(track, items, true);
    root.innerHTML = `
    <div class="view">
      <div class="result-hero">
        <div class="result-score">${correctCount}/${total}</div>
        <div class="result-verdict ${passed?'pass':'fail'}">${passed?`${cfg.unitCompleteTitle} (${pct}%)`:`${cfg.failLabel}: ${pct}% (${cfg.neededLabel} ${UNIT_PASS}%)`}</div>
        <p style="color:var(--ink-soft);margin-top:.5rem;">${passed?cfg.unitPassSub:cfg.unitFailSub}</p>
      </div>
      <div class="result-actions">
        <button class="secondary-btn" data-nav="unit:${u.id}">${cfg.reviewLabel}</button>
        <button class="secondary-btn" data-nav="practice:${u.id}">${cfg.newQuestionsLabel}</button>
        <button class="secondary-btn" data-nav="chat:${u.level}">${cfg.chat.practiceCta}</button>
        <button class="primary-btn" data-nav="track:${track}">${cfg.mapLabel}</button>
      </div>
      ${missed ? `<h2 class="review-h">${cfg.missedHeading}</h2>${missed}` : ''}
    </div>`;
    attachNavHandlers();
    return;
  }
  const zhCls = track==='zh' ? 'zh' : '';
  renderQuestionCard(track, quiz[state.qIndex], state.qIndex, total,
    `<button data-nav="unit:${u.id}" class="${zhCls}">${u.title}</button> <span>›</span> <span>${track==='es'?'Prueba de dominio':'Mastery test'}</span>`,
    ()=>{ state.qIndex++; renderUnitPractice(); });
}

function renderTest(){
  const track = state.track; const cfg = TRACKS[track];
  const t = cfg.tests.find(x=>x.id===state.testId);
  if(!state.quiz) state.quiz = buildCheckpoint(track, t);
  const quiz = state.quiz; const total = quiz.length;
  if(state.qIndex >= total){
    const correctCount = state.answers.filter(a=>a.correct).length;
    const pct = Math.round((correctCount/total)*100);
    const passed = pct >= t.pass;
    if(!state.saved){
      state.saved = true;
      saveTestResult(track,t.id, correctCount, total, passed);
      markSeen(track, quiz); saveSeen();
    }
    renderNav();
    const reviewHtml = reviewListHtml(track, quiz.map((q,i)=>({q, a:state.answers[i]})), false);
    root.innerHTML = `
    <div class="view">
      <div class="result-hero">
        <div class="result-score">${correctCount}/${total}</div>
        <div class="result-verdict ${passed?'pass':'fail'}">${passed?`${cfg.passLabel} (${pct}%)`:`${cfg.failLabel}: ${pct}% (${cfg.neededLabel} ${t.pass}%)`}</div>
      </div>
      <div class="result-actions">
        <button class="secondary-btn" data-nav="test:${t.id}">${cfg.newQuestionsLabel}</button>
        <button class="primary-btn" data-nav="track:${track}">${cfg.mapLabel}</button>
      </div>
      <h2 class="review-h">${cfg.reviewHeading}</h2>
      ${reviewHtml}
    </div>`;
    attachNavHandlers();
    return;
  }
  const head = state.qIndex===0 ? `<p class="checkpoint-note">${cfg.checkpointNote(total)}</p>` : '';
  renderQuestionCard(track, quiz[state.qIndex], state.qIndex, total,
    `<button data-nav="track:${track}">${track==='es'?'Inicio':'Home'}</button> <span>›</span> <span>${t.title}</span>`,
    ()=>{ state.qIndex++; renderTest(); });
  if(head){ const card=root.querySelector('.q-card'); if(card) card.insertAdjacentHTML('beforebegin', head); }
}

/* ===== Chat practice (sample capability) ===== */
async function callTutor(payload){
  let res;
  try{
    res = await fetch('/.netlify/functions/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  }catch(e){ throw {code:'network'}; }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const code = res.status===429 ? 'rate_limited' : (data && data.error) || 'http_'+res.status;
    throw {code};
  }
  return data;
}

function scrollChatToBottom(){
  const el = document.getElementById('chatMessages');
  if(el) el.scrollTop = el.scrollHeight;
}

function appendChatBubble(role, text, track){
  const wrap = document.getElementById('chatMessages');
  if(!wrap) return null;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role==='user' ? 'user' : 'tutor');
  const b = document.createElement('div');
  b.className = 'msg-bubble ' + (role==='user' ? 'user' : role==='system' ? 'system' : 'tutor');
  if(role==='tutor'){
    tokenizeForTap(track, text).forEach(tok=>{
      if(tok.word){
        const span = document.createElement('span');
        span.className = 'tap-word';
        span.textContent = tok.text;
        span.addEventListener('click', (e)=> showDefinition(e, tok.word, text, track));
        b.appendChild(span);
      } else {
        b.appendChild(document.createTextNode(tok.text));
      }
    });
  } else {
    b.textContent = text;
  }
  row.appendChild(b);
  wrap.appendChild(row);
  scrollChatToBottom();
  return b;
}

function appendCorrection(text, track){
  const wrap = document.getElementById('chatMessages');
  if(!wrap) return;
  const c = document.createElement('div');
  c.className = 'msg-correction';
  const span = document.createElement('span');
  span.textContent = text;
  c.innerHTML = '<b>'+TRACKS[track].chat.correctionLabel+':</b> ';
  c.appendChild(span);
  wrap.appendChild(c);
  scrollChatToBottom();
}

function appendTyping(){
  const wrap = document.getElementById('chatMessages');
  if(!wrap) return;
  const row = document.createElement('div');
  row.className = 'msg-row tutor';
  row.id = 'chatTypingRow';
  row.innerHTML = '<div class="msg-bubble tutor"><span class="typing-dots"><i></i><i></i><i></i></span></div>';
  wrap.appendChild(row);
  scrollChatToBottom();
}
function removeTyping(){
  const row = document.getElementById('chatTypingRow');
  if(row) row.remove();
}

function closeDefPopover(){
  const p = document.getElementById('defPop');
  if(p) p.remove();
  document.removeEventListener('click', outsideDefPopClick, true);
}
function outsideDefPopClick(e){
  const p = document.getElementById('defPop');
  if(p && !p.contains(e.target)) closeDefPopover();
}
async function showDefinition(evt, word, sentence, track){
  evt.stopPropagation();
  closeDefPopover();
  const wrap = document.getElementById('chatMessages');
  if(!wrap) return;
  const pop = document.createElement('div');
  pop.className = 'def-pop';
  pop.id = 'defPop';
  const wordDiv = document.createElement('div');
  wordDiv.className = 'pop-word'; wordDiv.textContent = word;
  const noteDiv = document.createElement('div');
  noteDiv.className = 'pop-note'; noteDiv.textContent = '…';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'pop-close'; closeBtn.textContent = '×';
  pop.appendChild(closeBtn); pop.appendChild(wordDiv); pop.appendChild(noteDiv);
  wrap.appendChild(pop);
  const rect = evt.target.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const top = rect.bottom - wrapRect.top + wrap.scrollTop + 6;
  const left = Math.max(8, Math.min(rect.left - wrapRect.left, wrap.clientWidth - 240));
  pop.style.top = top+'px';
  pop.style.left = left+'px';
  closeBtn.addEventListener('click', closeDefPopover);
  setTimeout(()=>document.addEventListener('click', outsideDefPopClick, true), 0);

  try{
    const data = await callTutor({kind:'define', track, word, sentence});
    pop.innerHTML = '';
    pop.appendChild(closeBtn);
    pop.appendChild(wordDiv);
    if(data && data.reading){
      const r = document.createElement('div'); r.className='pop-reading'; r.textContent = data.reading;
      pop.appendChild(r);
    }
    const tr = document.createElement('div'); tr.textContent = (data && data.translation) || '—';
    pop.appendChild(tr);
    if(data && data.note){
      const n = document.createElement('div'); n.className='pop-note'; n.textContent = data.note;
      pop.appendChild(n);
    }
  }catch(e){
    noteDiv.textContent = '—';
  }
}

function chatErrorCopy(track, code){
  const c = TRACKS[track].chat;
  if(code==='missing_key') return {text:c.unavailable+' (API key not set: add the Samson environment variable in Netlify and redeploy.)', block:true};
  if(code==='not_granted') return {text:c.notGranted, block:true};
  if(code==='sampling_disabled' || code==='not_declared' || code==='capability_disabled' || code==='capability_removed') return {text:c.unavailable, block:true};
  if(code==='rate_limited') return {text:c.rateLimited, block:false};
  if(code==='cancelled') return {text:'', block:false};
  return {text:c.connectError, block:false};
}

function setChatBlocked(){
  state.blocked = true;
  const row = document.getElementById('chatInputRow');
  if(row) row.style.display = 'none';
}

async function sendChatMessage(){
  if(state.sending || state.blocked) return;
  const track = state.track;
  const input = document.getElementById('chatInput');
  const text = (input.value||'').trim();
  if(!text) return;
  state.messages.push({role:'user', text});
  appendChatBubble('user', text, track);
  input.value = '';
  autosizeChatInput();
  state.sending = true;
  const sendBtn = document.getElementById('chatSendBtn');
  if(sendBtn) sendBtn.disabled = true;
  appendTyping();

  const turns = state.messages.map(m=>({role:m.role, content:m.text}));
  try{
    const data = await callTutor({kind:'chat', track, level:state.level, topic:state.topic, messages:turns});
    removeTyping();
    const reply = (data && data.reply) ? String(data.reply) : '';
    if(!reply) throw {code:'empty_completion'};
    state.messages.push({role:'assistant', text:reply});
    appendChatBubble('assistant', reply, track);
    if(data.correction && data.correction !== 'null') appendCorrection(String(data.correction), track);
  }catch(err){
    removeTyping();
    const info = chatErrorCopy(track, err && err.code);
    if(info.text) appendChatBubble('system', info.text, track);
    if(info.block) setChatBlocked();
  }finally{
    state.sending = false;
    const btn = document.getElementById('chatSendBtn');
    if(btn) btn.disabled = false;
  }
}

function autosizeChatInput(){
  const input = document.getElementById('chatInput');
  if(!input) return;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110)+'px';
}

function resetChatConversation(){
  const track = state.track;
  const cfg = TRACKS[track];
  closeDefPopover();
  state.messages = [];
  const wrap = document.getElementById('chatMessages');
  if(wrap) wrap.innerHTML = '';
  const opener = cfg.chat.openers[state.topic] || cfg.chat.openers.general;
  state.messages.push({role:'assistant', text:opener});
  appendChatBubble('assistant', opener, track);
}

function renderChat(){
  const track = state.track; const cfg = TRACKS[track]; const chat = cfg.chat;
  const zhCls = track==='zh' ? 'zh' : '';
  const lvlChips = cfg.levels.map(lv=>`<button class="lvl-chip ${lv===state.level?'active':''}" data-lvl="${lv}">${lv}</button>`).join('');
  const topicChips = chat.topics.map(t=>`<button class="topic-chip2 ${zhCls} ${t.id===state.topic?'active':''}" data-topic="${t.id}">${t.label}</button>`).join('');
  root.innerHTML = `
  <div class="view chat-view">
    <div class="crumb"><button data-nav="track:${track}">${chat.crumbHome}</button> <span>›</span> <span>${chat.crumbChat}</span></div>
    <h1 class="${zhCls}" style="font-size:1.5rem;">${chat.title}</h1>
    <p style="color:var(--ink-soft);font-size:.92rem;">${chat.sub}</p>
    <div class="chip-row-label">${chat.levelPickerLabel}</div>
    <div class="chip-row" id="lvlChipRow">${lvlChips}</div>
    <div class="chat-toolbar">
      <div class="chip-row" id="topicChipRow" style="margin-bottom:0;">${topicChips}</div>
      <button class="chat-reset" id="chatResetBtn">${chat.resetLabel}</button>
    </div>
    <div class="chat-box">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row" id="chatInputRow">
        <textarea id="chatInput" rows="1" placeholder="${chat.placeholder}"></textarea>
        <button id="chatSendBtn">${chat.sendLabel}</button>
      </div>
    </div>
    <p class="chat-tap-hint">${chat.tapHint}</p>
  </div>`;

  document.getElementById('lvlChipRow').querySelectorAll('[data-lvl]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.level = btn.dataset.lvl;
      document.getElementById('lvlChipRow').querySelectorAll('[data-lvl]').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });
  document.getElementById('topicChipRow').querySelectorAll('[data-topic]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.topic = btn.dataset.topic;
      document.getElementById('topicChipRow').querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('active', b===btn));
      resetChatConversation();
    });
  });
  document.getElementById('chatResetBtn').addEventListener('click', resetChatConversation);
  document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
  const input = document.getElementById('chatInput');
  input.addEventListener('input', autosizeChatInput);
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(); }
  });

  resetChatConversation();
  attachNavHandlers();
}

function attachNavHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick = ()=> navigate(el.dataset.nav); });
}

function render(){
  if(state.view==='landing' || !state.track){
    landing.style.display='block';
    appEl.classList.remove('ready');
    renderLanding();
    return;
  }
  landing.style.display='none';
  appEl.classList.add('ready');
  if(state.view==='home') renderHome();
  else if(state.view==='unit') state.mode==='practice' ? renderUnitPractice() : renderUnitLesson();
  else if(state.view==='test') renderTest();
  else if(state.view==='chat') renderChat();
  else if(state.view==='vocab') renderVocab();
  else if(state.view==='conjSetup') renderConjSetup();
  else if(state.view==='conjDrill') renderConjDrill();
  renderNav();
  attachNavHandlers();
}

document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
});
document.getElementById('overlay').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});
document.querySelector('#sidebar .back-link').addEventListener('click', ()=> navigate('landing'));
document.getElementById('vocabNavBtn').addEventListener('click', ()=>{ if(state.track) navigate('vocab'); });
document.getElementById('chatNavBtn').addEventListener('click', ()=>{
  if(!state.track) return;
  navigate('chat:'+defaultChatLevel(state.track));
});

render();
paintSyncStatus();
initNetlifySync();
</script>
