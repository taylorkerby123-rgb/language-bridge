  @media (prefers-color-scheme: dark) {
    --paper:#15181F; --paper-deep:#1C202A; --ink:#EDEDE6; --ink-soft:#A7ABB6;
    --line:#2C313D; --white:#1E222C; --navy:#2B3F63; --navy-deep:#0D1420;
  }
}
:root[data-theme="dark"]{
  --paper:#15181F; --paper-deep:#1C202A; --ink:#EDEDE6; --ink-soft:#A7ABB6;
  --line:#2C313D; --white:#1E222C; --navy:#2B3F63; --navy-deep:#0D1420;
}
*{box-sizing:border-box;}
html,body{height:100%;overflow-x:hidden;width:100%;}
body{
  margin:0;color:var(--ink);max-width:100vw;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:
    radial-gradient(ellipse 70% 40% at 50% -10%, rgba(24,42,99,.05), transparent 60%),
    var(--paper);
  background-attachment:fixed;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;margin:0 0 .5em;line-height:1.15;color:var(--ink);}
p{line-height:1.6;margin:0 0 1em;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:.92rem;}
th,td{border:1px solid var(--line);padding:.45em .65em;text-align:left;}
th{background:var(--paper-deep);font-weight:600;}
tr:nth-child(even) td{background:color-mix(in srgb, var(--paper-deep) 45%, var(--paper));}
code{background:var(--paper-deep);padding:.1em .35em;border-radius:4px;font-size:.9em;}
.zh{font-family:"Noto Sans SC","Inter",sans-serif;}

/* ===== Landing (language picker) ===== */
#landing{max-width:980px;margin:0 auto;padding:4.5rem 2rem 5rem;}
.landing-head{text-align:center;margin-bottom:3.2rem;animation:riseIn .7s ease both;}
.landing-head .kicker{
  display:inline-flex;align-items:center;gap:.5rem;font-size:.76rem;font-weight:700;letter-spacing:.05em;
  background:var(--white);border:1px solid var(--line);color:var(--ink-soft);padding:.35rem .9rem;border-radius:99px;
  margin-bottom:1.1rem;box-shadow:0 2px 10px rgba(24,42,99,.06);
}
.landing-head .kicker b{color:var(--navy);}
.landing-head h1{
  font-size:clamp(2.4rem,6vw,3.4rem);margin-bottom:.2rem;font-weight:700;letter-spacing:-.01em;
  color:var(--navy);
}
.landing-head .zh-sub{font-family:"Noto Sans SC",sans-serif;font-size:1.4rem;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:.9rem;letter-spacing:.08em;}
.landing-head p{color:var(--ink-soft);max-width:46ch;margin:0 auto;font-size:1.02rem;}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem;}
@media (max-width:680px){.lang-grid{grid-template-columns:1fr;}}

.lang-card{
  border-radius:14px;overflow:hidden;position:relative;
  box-shadow:0 6px 18px -10px rgba(20,20,30,.22), 0 1px 3px rgba(20,20,30,.05);
  display:flex;flex-direction:column;background:var(--white);
  border:1px solid var(--line);
  animation:riseIn .6s ease both; animation-delay:.05s;
  transition:transform .15s ease, box-shadow .15s ease;
}
.lang-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(20,20,30,.26), 0 2px 6px rgba(20,20,30,.06);}
.lang-card.zh{animation-delay:.12s;}

.lang-card .stub{
  position:relative;padding:1.3rem 1.5rem;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.lang-card.es .stub{background:var(--navy);}
.lang-card.zh .stub{background:var(--zh-red);}
.lang-card .stub-top{display:flex;align-items:center;gap:.7rem;}
.lang-card .flag{font-size:1.9rem;line-height:1;}
.lang-card .route-pill{
  font-size:.72rem;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.35);padding:.28rem .65rem;border-radius:6px;white-space:nowrap;
}
.lang-card h2{font-size:1.35rem;margin:0;color:#fff;font-weight:600;}
.lang-card .zh-name{font-family:"Noto Sans SC",sans-serif;font-size:1.35rem;font-weight:700;color:#fff;}

.lang-card .body{padding:1.4rem 1.5rem 1.6rem;display:flex;flex-direction:column;gap:1.1rem;flex:1;border-top:1px solid var(--line);}
.lang-card .desc{color:var(--ink-soft);font-size:.92rem;margin:0;}
.lang-card .ring-row{display:flex;align-items:center;gap:1.1rem;}
.ring-wrap{position:relative;width:60px;height:60px;flex-shrink:0;}
.ring-svg{position:absolute;inset:0;}
.ring-svg.es{color:var(--navy);}
.ring-svg.zh{color:var(--zh-red);}
.ring-wrap .ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Inter",sans-serif;font-size:.92rem;font-weight:700;}
.lang-card.es .ring-wrap .ring-pct{color:var(--navy);}
.lang-card.zh .ring-wrap .ring-pct{color:var(--zh-red);}
.lang-card .ring-caption{font-size:.8rem;color:var(--ink-soft);font-weight:500;}
.lang-card .levels-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem;}
.level-chip{
  font-size:.68rem;font-weight:600;padding:.22rem .55rem;border-radius:5px;
  background:var(--paper-deep);color:var(--ink-soft);border:1px solid var(--line);
}
.level-chip.done{background:var(--olive);color:#fff;border-color:var(--olive);}
.lang-card .go-btn{
  align-self:flex-start;border:none;color:#fff;padding:.7rem 1.4rem;border-radius:8px;
  font-weight:600;font-size:.9rem;margin-top:.1rem;
  transition:filter .12s ease;
}
.lang-card .go-btn:hover{filter:brightness(1.1);}
.lang-card.es .go-btn{background:var(--navy);}
.lang-card.zh .go-btn{background:var(--zh-red);}
.just-chat-link{align-self:flex-start;background:none;border:none;color:var(--ink-soft);font-size:.8rem;text-decoration:underline;padding:0;margin-top:-.3rem;}
.just-chat-link:hover{color:var(--ink);}

@keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.landing-head,.lang-card{animation:none;}}

/* ===== App shell (per-track) ===== */
#app{display:none;min-height:100vh;max-width:100vw;overflow-x:hidden;}
#app.ready{display:flex;}
#sidebar{
  width:280px;flex-shrink:0;color:#EDEFF5;
  padding:1.4rem 1rem 2rem;overflow-y:auto;padding-top:calc(1.4rem + env(safe-area-inset-top,0px));
}
#sidebar[data-track="es"]{background:linear-gradient(165deg,var(--navy) 0%,var(--navy-deep) 100%);}
#sidebar[data-track="zh"]{background:linear-gradient(165deg,var(--zh-red) 0%,var(--zh-red-deep) 100%);}
#sidebar .back-link{background:none;border:none;color:rgba(255,255,255,.75);font-size:.76rem;padding:0 0 .8rem;text-decoration:underline;}
#sidebar .brand{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.2rem;}
#sidebar .brand strong{font-family:"Fraunces",serif;font-size:1.35rem;color:var(--gold-soft);}
#sidebar[data-track="zh"] .brand strong{font-family:"Noto Sans SC",sans-serif;}
#sidebar .overall{margin:1rem 0 1.4rem;}
#sidebar .overall .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;}
#sidebar .overall .bar > i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease;}
#sidebar .overall p{font-size:.75rem;color:rgba(255,255,255,.7);margin:.4rem 0 0;}
.level-group{margin-bottom:1rem;}
.level-group h4{font-family:"Inter",sans-serif;font-size:.68rem;letter-spacing:.08em;font-weight:700;color:rgba(255,255,255,.55);margin:1.1rem 0 .4rem;padding-left:.4rem;}
.nav-item{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:8px;font-size:.86rem;color:#EDEFF5;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:background .12s ease;}
.nav-item span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.nav-item:hover{background:rgba(255,255,255,.12);}
.nav-item.active{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 2px 0 0 var(--gold-soft);}
.nav-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.45);}
.nav-item.done .dot{background:var(--gold-soft);border-color:var(--gold-soft);}
.nav-item.test{font-weight:600;}
.nav-item.test .dot{background:none;border:none;width:auto;font-size:.9rem;}
.nav-item.test.passed{color:var(--gold-soft);}

.chat-nav-btn{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.6rem .7rem;margin-bottom:.6rem;border-radius:9px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font-size:.85rem;font-weight:600;transition:background .12s ease;}
.chat-nav-btn:hover{background:rgba(255,255,255,.16);}
.chat-nav-btn.active{background:rgba(255,255,255,.22);box-shadow:inset 2px 0 0 var(--gold-soft);}

#main{flex:1;min-width:0;overflow-y:auto;height:100vh;padding-top:env(safe-area-inset-top,0px);}
.topbar{display:none;align-items:center;justify-content:space-between;padding:.8rem 1rem;color:#fff;position:sticky;top:0;z-index:5;padding-top:calc(.8rem + env(safe-area-inset-top,0px));}
.topbar[data-track="es"]{background:linear-gradient(100deg,var(--navy),var(--navy-2));}
.topbar[data-track="zh"]{background:linear-gradient(100deg,var(--zh-red),var(--zh-red-2));}
.topbar strong{font-family:"Fraunces",serif;color:var(--gold-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.topbar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:.35rem .6rem;font-size:1.1rem;line-height:1;}

.view{max-width:760px;margin:0 auto;padding:3rem 2rem 6rem;}
@media (max-width:640px){.view{padding:1.6rem 1.1rem 4rem;} .chat-box{height:min(72vh,560px);} .msg-bubble,.msg-correction{max-width:92%;}
  #view-home .hero{padding:1.1rem 0 .9rem;}
  .arc-wrap{margin:.7rem 0 1.1rem;}
  .arc-step .circle{width:40px;height:40px;font-size:.78rem;border-width:2px;}
  .arc-step .lbl{font-size:.66rem;}
  .arc-line{margin-top:-20px;}
  .hero h1{font-size:1.45rem;max-width:none;}
  .hero .lede{font-size:.85rem;max-width:none;}
  .hero-cta{padding:.65rem 1.15rem;font-size:.88rem;}
  .roadmap-grid{margin-top:1.1rem;gap:.65rem;}
  .level-card{padding:.75rem .9rem;border-radius:11px;}
  .level-card h3{font-size:.95rem;margin-bottom:.3rem;}
  .unit-row{padding:.4rem .1rem;font-size:.82rem;}
  .unit-row .status{font-size:.66rem;}
  .test-row{padding:.4rem .1rem;font-size:.8rem;}
  .netlify-note{margin-top:1.2rem;padding:.7rem .85rem;font-size:.76rem;}
}

#view-home .hero{padding:3rem 0 2rem;}
.arc-wrap{display:flex;align-items:center;justify-content:center;gap:0;margin:1.5rem 0 2.2rem;}
.arc-step{display:flex;flex-direction:column;align-items:center;gap:.5rem;flex:1;position:relative;}
.arc-step .circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:700;font-size:1rem;border:2.5px solid var(--track-color, var(--navy));background:var(--white);color:var(--track-color, var(--navy));z-index:1;box-shadow:0 4px 10px -3px rgba(20,20,30,.18);transition:transform .15s ease;}
.arc-step.current .circle{background:var(--track-color, var(--navy));color:var(--gold-soft);}
.arc-step .lbl{font-size:.75rem;color:var(--ink-soft);text-align:center;}
.arc-line{flex:1;height:3px;background:linear-gradient(90deg,var(--track-color, var(--navy)),var(--gold));opacity:.4;margin-top:-29px;border-radius:99px;}
.hero h1{font-size:clamp(2.1rem,5.5vw,2.9rem);max-width:16ch;}
.hero .lede{font-size:1.05rem;color:var(--ink-soft);max-width:52ch;}
.hero-cta{display:inline-flex;align-items:center;gap:.5rem;color:#fff;border:none;padding:.85rem 1.5rem;border-radius:8px;font-size:1rem;font-weight:600;margin-top:.6rem;background:var(--track-color, var(--navy));transition:filter .12s ease;}
.hero-cta:hover{filter:brightness(1.1);}
.roadmap-grid{display:grid;gap:1rem;margin-top:2.5rem;}
.level-card{border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.3rem;background:var(--white);box-shadow:0 4px 14px -8px rgba(20,20,30,.12);}
.level-card h3{font-size:1.1rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;}
.level-card .tag{font-size:.68rem;letter-spacing:.06em;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--navy-deep);padding:.18rem .55rem;border-radius:99px;}
.unit-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-top:1px solid var(--line);font-size:.9rem;}
.unit-row:first-of-type{border-top:none;}
.unit-row button{background:none;border:none;color:var(--ink);text-align:left;flex:1;min-width:0;font-size:.9rem;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.unit-row .status{font-size:.72rem;color:var(--ink-soft);flex-shrink:0;}
.unit-row.status-done .status{color:var(--olive);font-weight:600;}
.test-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .2rem;margin-top:.2rem;border-top:1.5px dashed var(--line);font-size:.88rem;font-weight:600;}
.test-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.test-row button{flex-shrink:0;background:var(--track-color, var(--brick));color:#fff;border:none;padding:.4rem .9rem;border-radius:8px;font-weight:600;}
.netlify-note{margin-top:2.2rem;padding:1rem 1.2rem;border:1px dashed var(--line);border-radius:var(--radius);font-size:.85rem;color:var(--ink-soft);background:var(--white);}
.netlify-note a{color:var(--navy);font-weight:600;text-decoration:underline;}

.crumb{font-size:.78rem;color:var(--ink-soft);margin-bottom:.6rem;display:flex;gap:.4rem;align-items:center;min-width:0;}
.crumb button{background:none;border:none;color:var(--ink-soft);text-decoration:underline;padding:0;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:60vw;}
.crumb span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.unit-tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;font-weight:600;color:#fff;background:var(--track-color, var(--navy));padding:.25rem .7rem;border-radius:6px;margin-bottom:.8rem;}

.card-dots{display:flex;gap:6px;margin:1rem 0 1.4rem;}
.card-dots i{display:block;width:7px;height:7px;border-radius:50%;background:var(--line);}
.card-dots i.on{background:var(--track-color, var(--navy));width:18px;border-radius:99px;transition:width .2s ease;}
.lesson-card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--track-color, var(--navy));border-radius:12px;padding:1.6rem 1.7rem;min-height:220px;box-shadow:0 4px 14px -10px rgba(20,20,30,.18);}
.lesson-card h2{font-size:1.25rem;margin-top:0;}
.lesson-card .note{background:linear-gradient(135deg,color-mix(in srgb, var(--gold) 14%, var(--paper-deep)),var(--paper-deep));border-left:3px solid var(--gold);padding:.7rem .95rem;border-radius:0 8px 8px 0;margin:.8em 0;font-size:.88rem;}
.lesson-card .warn{background:color-mix(in srgb, var(--brick) 10%, var(--paper-deep));border-left:3px solid var(--brick);padding:.7rem .95rem;border-radius:0 8px 8px 0;margin:.8em 0;font-size:.88rem;}
.lesson-card ul.tight li{margin-bottom:.3em;}
.en-block{margin-top:1.4rem;padding-top:1.2rem;border-top:1px dashed var(--line);}
.en-block .en-label{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);background:var(--paper-deep);padding:.2rem .55rem;border-radius:4px;margin-bottom:.6rem;}
.en-block h3{font-size:1.02rem;margin:0 0 .5em;color:var(--ink-soft);font-family:"Inter",sans-serif;font-weight:700;}
.en-block table,.en-block .note,.en-block .warn,.en-block p,.en-block ul{font-size:.88rem;}
.en-block table th, .en-block table td{color:var(--ink-soft);}
.card-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.3rem;gap:.6rem;}
.primary-btn{background:var(--track-color, var(--navy));color:#fff;border:none;padding:.8rem 1.5rem;border-radius:8px;font-weight:600;font-size:.95rem;transition:filter .12s ease;}
.primary-btn:hover{filter:brightness(1.1);}
.primary-btn:disabled{opacity:.4;cursor:default;}
.secondary-btn{background:var(--white);border:1.5px solid var(--track-color, var(--navy));color:var(--track-color, var(--navy));padding:.75rem 1.4rem;border-radius:10px;font-weight:700;font-size:.9rem;transition:background .12s ease;}
.secondary-btn:hover{background:var(--paper-deep);}

.progress-line{display:flex;align-items:center;gap:.7rem;margin-bottom:1.6rem;}
.progress-line .bar{flex:1;height:7px;border-radius:99px;background:var(--paper-deep);overflow:hidden;}
.progress-line .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--track-color, var(--navy)),var(--gold));}
.progress-line span{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;font-weight:600;}
.q-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:1.6rem;box-shadow:0 4px 14px -10px rgba(20,20,30,.18);}
.q-prompt{font-size:1.15rem;margin-bottom:1.2rem;line-height:1.6;font-weight:500;}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:.75rem 1rem;margin-bottom:.55rem;font-size:1rem;color:var(--ink);transition:border-color .12s ease, transform .1s ease;}
.opt:hover:not(:disabled){border-color:var(--track-color, var(--navy));transform:translateX(2px);}
.opt.correct{border-color:var(--olive);background:color-mix(in srgb, var(--olive) 14%, var(--white));font-weight:600;box-shadow:0 0 0 2px color-mix(in srgb, var(--olive) 30%, transparent);}
.opt.incorrect{border-color:var(--brick);background:color-mix(in srgb, var(--brick) 12%, var(--white));}
.opt:disabled{cursor:default;}
.explain{margin-top:1rem;padding:.85rem 1.05rem;border-radius:10px;font-size:.9rem;background:var(--paper-deep);}
.explain.ok{border-left:3px solid var(--olive);}
.explain.no{border-left:3px solid var(--brick);}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.4rem;}

/* ---- Conjugation Drills ---- */
.conj-banner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:1.1rem 1.4rem;margin-top:1.6rem;}
.conj-banner h3{margin:0 0 .2rem;font-size:1.05rem;}
.conj-banner p{margin:0;color:var(--ink-soft);font-size:.88rem;max-width:48ch;}
.conj-nav-wrap{padding:0 0 .7rem;margin-bottom:.7rem;border-bottom:1px solid rgba(255,255,255,.16);}
.nav-item.conj-nav .dot{background:none;border:none;width:auto;font-size:.95rem;}
.conj-setup-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:1.6rem 1.7rem;box-shadow:0 4px 14px -10px rgba(20,20,30,.18);}
.conj-setup-card h3{font-size:1.02rem;margin:1.2rem 0 .6rem;}
.conj-setup-card h3:first-child{margin-top:0;}
.chip-row{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.4rem;}
.chip{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:.5rem 1.05rem;font-size:.87rem;color:var(--ink);font-weight:600;transition:border-color .12s ease,background .12s ease,color .12s ease;}
.chip:hover:not(.active){border-color:var(--track-color, var(--navy));}
.chip.active{background:var(--track-color, var(--navy));border-color:var(--track-color, var(--navy));color:#fff;}
.chip .sub{display:block;font-size:.72rem;font-weight:500;opacity:.8;}
.conj-verb-tag{display:inline-block;font-family:"Fraunces",serif;font-weight:700;font-size:1.3rem;color:var(--track-color, var(--navy));}
.conj-pronoun-tag{font-size:.95rem;color:var(--ink-soft);font-weight:600;}
.conj-en-hint{font-size:.8rem;color:var(--ink-soft);margin-top:.3rem;}

.result-hero{text-align:center;padding:2.2rem 1rem;}
.result-score{font-family:"Fraunces",serif;font-size:3.6rem;font-weight:700;background:linear-gradient(135deg,var(--track-color, var(--navy)),var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
.result-verdict{font-size:1.15rem;font-weight:700;margin-top:.2rem;}

<script>
const ES_UNITS1 = [

{id:'u1', level:'A2', num:1, title:'Complementos indirectos y "gustar"',
lessonCards:[
{h:'La idea en una frase', body:`<p>El complemento indirecto dice <em>a quién</em> le pasa algo. Con "gustar" y verbos parecidos, la persona lleva ese pronombre — nunca es el sujeto.</p>`, hEn:'The idea in one line', bodyEn:`<p>The indirect object tells you <em>to whom</em> something happens. With "gustar" (to like) and similar verbs, the person takes that pronoun — the person is never the subject.</p>`},
{h:'Los pronombres', body:`
<table><tr><th>yo</th><th>tú</th><th>él/ella/Ud.</th><th>nosotros</th><th>vosotros</th><th>ellos/Uds.</th></tr>
<tr><td>me</td><td>te</td><td>le</td><td>nos</td><td>os</td><td>les</td></tr></table>
<p>Van antes del verbo conjugado, o pegados al infinitivo: <code>Le doy el libro</code> / <code>Voy a darle el libro</code>.</p>`, hEn:'The pronouns', bodyEn:`
<table><tr><th>yo</th><th>tú</th><th>él/ella/Ud.</th><th>nosotros</th><th>vosotros</th><th>ellos/Uds.</th></tr>
<tr><td>me</td><td>te</td><td>le</td><td>nos</td><td>os</td><td>les</td></tr></table>
<p>They go before the conjugated verb, or attached to an infinitive: <code>Le doy el libro</code> (I give him the book) / <code>Voy a darle el libro</code> (I’m going to give him the book).</p>`},
{h:'La fórmula de "gustar"', body:`
<div class="note"><strong>(A + persona) + pronombre + gustar</strong>, y el verbo concuerda con la <u>cosa</u>, no con la persona.<br>
<code>A mí me gusta el café.</code> (una cosa → gusta)<br>
<code>A nosotros nos gustan los libros.</code> (varias cosas → gustan)</div>
<p>"A + persona" es opcional; solo aclara o da énfasis.</p>`, hEn:'The "gustar" formula', bodyEn:`
<div class="note"><strong>(A + person) + pronoun + gustar</strong>, and the verb agrees with the <u>thing liked</u>, not the person.<br>
<code>A mí me gusta el café.</code> I like coffee. (one thing → gusta)<br>
<code>A nosotros nos gustan los libros.</code> We like books. (several things → gustan)</div>
<p>"A + person" is optional; it only clarifies or adds emphasis.</p>`},
{h:'Verbos con el mismo patrón', body:`
<ul class="tight">
<li><strong>encantar</strong> — Me encanta esta canción.</li>
<li><strong>interesar</strong> — Nos interesan las noticias.</li>
<li><strong>molestar</strong> — ¿Te molesta el ruido?</li>
<li><strong>importar</strong> — No me importa la hora.</li>
<li><strong>faltar</strong> — Me faltan dos dólares.</li>
<li><strong>doler</strong> (o→ue) — Le duele la cabeza.</li>
<li><strong>parecer</strong> — ¿Qué te parece la idea?</li>
</ul>
<div class="warn"><strong>Error común:</strong> "A mí me gusta<u>n</u> las clases" — no "gusta las clases".</div>`, hEn:'Verbs with the same pattern', bodyEn:`
<ul class="tight">
<li><strong>encantar</strong> (to love) — Me encanta esta canción. I love this song.</li>
<li><strong>interesar</strong> (to interest) — Nos interesan las noticias. We’re interested in the news.</li>
<li><strong>molestar</strong> (to bother) — ¿Te molesta el ruido? Does the noise bother you?</li>
<li><strong>importar</strong> (to matter) — No me importa la hora. The time doesn’t matter to me.</li>
<li><strong>faltar</strong> (to be lacking) — Me faltan dos dólares. I’m short two dollars.</li>
<li><strong>doler</strong> (to hurt, o→ue) — Le duele la cabeza. His/her head hurts.</li>
<li><strong>parecer</strong> (to seem) — ¿Qué te parece la idea? What do you think of the idea?</li>
</ul>
<div class="warn"><strong>Common mistake:</strong> "A mí me gusta<u>n</u> las clases" (I like classes) — not "gusta las clases," because "las clases" is plural.</div>`}
],
practice:[
 {q:'A mí ___ gusta el café.', options:['me','le','te','nos'], correct:0, explain:'Primera persona singular → "me". "A mí" refuerza pero no reemplaza el pronombre.'},
 {q:'A nosotros ___ interesan las noticias de política.', options:['te','nos','les','me'], correct:1, explain:'"A nosotros" corresponde al pronombre "nos".'},
 {q:'Elige la forma correcta: "A ella ___ los libros de misterio."', options:['le gusta','le gustan','la gusta','les gusta'], correct:1, explain:'"Los libros" es plural, así que el verbo debe ser "gustan", y el pronombre correcto para "ella" es "le".'},
 {q:'"We like the movie." — la traducción correcta es:', options:['Gustamos la película.','Nos gusta la película.','Nos gustan la película.','Le gusta la película.'], correct:1, explain:'"La película" es singular → "gusta"; la persona (nosotros) toma el pronombre "nos".'},
 {q:'A ti ___ duele la cabeza.', options:['te','ti','tu','le'], correct:0, explain:'"A ti" corresponde al pronombre de objeto indirecto "te".'},
 {q:'¿Cuál oración tiene un error?', options:['A mí me encanta el chocolate.','A ellos les faltan dos euros.','A nosotros nos parece las ideas.','A Juan le duelen los pies.'], correct:2, explain:'"Las ideas" es plural, así que debe ser "nos parecen las ideas", no "nos parece".'},
 {q:'A los estudiantes ___ interesa el proyecto nuevo.', options:['le','les','los','se'], correct:1, explain:'"A los estudiantes" (plural) corresponde al pronombre "les".'},
 {q:'"Se me olvidó" — ¿qué pronombre corresponde a "yo" en esta estructura?', options:['me','te','se','le'], correct:0, explain:'"Se me olvidó" usa "me" para indicar a quién le pasó el olvido: a mí.'},
 {q:'A mi hermana ___ encantan los perros.', options:['le','les','la','se'], correct:0, explain:'"A mi hermana" es singular → "le".'},
 {q:'¿Cuál es la traducción de "I do not care"?', options:['No me importo.','No me importa.','No importa me.','No le importo.'], correct:1, explain:'"Importar" sigue el patrón de "gustar": no me importa (a mí no me importa esa cosa).'},
]},

{id:'u2', level:'A2', num:2, title:'Complementos directos y combinación de pronombres',
lessonCards:[
{h:'La idea en una frase', body:`<p>El complemento directo recibe la acción directamente. Cuando una oración tiene objeto indirecto Y directo, hay un orden fijo — y una regla especial para evitar un sonido raro.</p>`, hEn:'The idea in one line', bodyEn:`<p>The direct object receives the action directly. When a sentence has both an indirect and a direct object, there’s a fixed order — and a special rule to avoid an awkward sound.</p>`},
{h:'Los pronombres directos', body:`
<table><tr><th>yo</th><th>tú</th><th>él/ella/Ud.</th><th>nosotros</th><th>vosotros</th><th>ellos/Uds.</th></tr>
<tr><td>me</td><td>te</td><td>lo / la</td><td>nos</td><td>os</td><td>los / las</td></tr></table>
<p><code>Compro el libro.</code> → <code>Lo compro.</code> &nbsp; <code>Veo a María.</code> → <code>La veo.</code></p>`, hEn:'Direct object pronouns', bodyEn:`
<table><tr><th>yo</th><th>tú</th><th>él/ella/Ud.</th><th>nosotros</th><th>vosotros</th><th>ellos/Uds.</th></tr>
<tr><td>me</td><td>te</td><td>lo / la</td><td>nos</td><td>os</td><td>los / las</td></tr></table>
<p><code>Compro el libro.</code> (I buy the book.) → <code>Lo compro.</code> (I buy it.) &nbsp; <code>Veo a María.</code> (I see María.) → <code>La veo.</code> (I see her.)</p>`},
{h:'Combinando indirecto + directo', body:`
<p>El indirecto siempre va primero. Y si es <code>le</code>/<code>les</code> seguido de <code>lo, la, los, las</code>, se convierte en <strong>"se"</strong>.</p>
<div class="note"><code>Le doy el regalo.</code> (IO) → <code>Se lo doy.</code> (IO+DO combinados)<br>Este "se" no tiene nada que ver con los verbos reflexivos.</div>`, hEn:'Combining indirect + direct', bodyEn:`
<p>The indirect object always goes first. And if it’s <code>le</code>/<code>les</code> followed by <code>lo, la, los, las</code>, it turns into <strong>"se"</strong>.</p>
<div class="note"><code>Le doy el regalo.</code> I give him the gift. (IO) → <code>Se lo doy.</code> I give it to him. (IO+DO combined)<br>This "se" has nothing to do with reflexive verbs.</div>`},
{h:'Dónde van los pronombres', body:`<p>Antes del verbo conjugado, o pegados al infinitivo/gerundio/mandato afirmativo. Ambas formas son igual de correctas:</p>
<div class="note"><code>Voy a comprarlo</code> = <code>Lo voy a comprar</code></div>`, hEn:'Where the pronouns go', bodyEn:`<p>Before the conjugated verb, or attached to an infinitive/gerund/affirmative command. Both forms below are equally correct:</p>
<div class="note"><code>Voy a comprarlo</code> = <code>Lo voy a comprar</code> — both mean "I’m going to buy it."</div>`}
],
practice:[
 {q:'Reemplaza el objeto directo: "Compro el libro."', options:['Lo compro.','La compro.','Le compro.','Los compro.'], correct:0, explain:'"El libro" es masculino singular → "lo".'},
 {q:'"Veo a María." →', options:['Lo veo.','La veo.','Le veo.','Les veo.'], correct:1, explain:'"María" es femenino singular → "la".'},
 {q:'"Doy el regalo a mi hermano." — combinando los pronombres:', options:['Le lo doy.','Se lo doy.','Lo le doy.','Se la doy.'], correct:1, explain:'"Le" + "lo" se convierte en "se lo" para evitar el choque de sonidos.'},
 {q:'"¿Me prestas tu coche?" "Sí, ___ presto."', options:['te lo','lo te','se lo','me lo'], correct:0, explain:'Objeto indirecto (te) antes que el directo (lo): "te lo presto".'},
 {q:'"Le doy los documentos a la profesora." →', options:['Se los doy.','Le los doy.','Se las doy.','La los doy.'], correct:0, explain:'"Le" + "los" (masculino plural, "los documentos") → "se los doy".'},
 {q:'¿Cuál de estas dos formas es correcta para "I am going to buy it"?', options:['Solo "Lo voy a comprar"','Solo "Voy a comprarlo"','Ambas son correctas','Ninguna es correcta'], correct:2, explain:'Con infinitivo, el pronombre puede ir antes del verbo conjugado o pegado al infinitivo.'},
 {q:'"Escribo la carta." →', options:['La escribo.','Lo escribo.','Le escribo.','Las escribo.'], correct:0, explain:'"La carta" es femenino singular → "la".'},
 {q:'"Mando los paquetes a mis padres." — combinando pronombres:', options:['Les los mando.','Se los mando.','Se las mando.','Los les mando.'], correct:1, explain:'"Les" + "los" (paquetes) → "se los mando".'},
 {q:'¿Cuál oración usa el orden correcto de pronombres?', options:['Lo te doy.','Te lo doy.','Doy te lo.','Te doy lo.'], correct:1, explain:'El indirecto siempre va antes del directo: te lo doy.'},
 {q:'"Estoy leyendo el libro." — con pronombre pegado al gerundio:', options:['Estoy leyéndolo.','Estoy lo leyendo.','Lo estoy leyéndolo.','Estoy leyendolo.'], correct:0, explain:'El pronombre pegado a un gerundio requiere tilde: leyéndolo.'},
]},

{id:'u3', level:'A2', num:3, title:'Verbos reflexivos y la rutina diaria',
lessonCards:[
{h:'La idea en una frase', body:`<p>Un verbo es reflexivo cuando el sujeto hace y recibe la acción a la vez: <code>Me levanto</code> (yo me levanto a mí mismo).</p>`, hEn:'The idea in one line', bodyEn:`<p>A verb is reflexive when the subject does the action to itself: <code>Me levanto</code> (I get [myself] up).</p>`},
{h:'Los pronombres reflexivos', body:`
<table><tr><th>yo</th><th>tú</th><th>él/ella/Ud.</th><th>nosotros</th><th>vosotros</th><th>ellos/Uds.</th></tr>
<tr><td>me</td><td>te</td><td>se</td><td>nos</td><td>os</td><td>se</td></tr></table>
<p>Verbos comunes: despertarse, levantarse, ducharse, vestirse, peinarse, acostarse, dormirse.</p>`, hEn:'Reflexive pronouns', bodyEn:`
<table><tr><th>yo</th><th>tú</th><th>él/ella/Ud.</th><th>nosotros</th><th>vosotros</th><th>ellos/Uds.</th></tr>
<tr><td>me</td><td>te</td><td>se</td><td>nos</td><td>os</td><td>se</td></tr></table>
<p>Common verbs: despertarse (to wake up), levantarse (to get up), ducharse (to shower), vestirse (to get dressed), peinarse (to comb one’s hair), acostarse (to go to bed), dormirse (to fall asleep).</p>`},
{h:'Cambia el significado', body:`
<table><tr><th>Sin reflexivo</th><th>Con reflexivo</th></tr>
<tr><td>dormir — to sleep</td><td>dormirse — to fall asleep</td></tr>
<tr><td>ir — to go</td><td>irse — to leave</td></tr>
<tr><td>llamar — to call</td><td>llamarse — to be named</td></tr>
<tr><td>poner — to put</td><td>ponerse — to put on / to become</td></tr></table>`, hEn:'The meaning can shift', bodyEn:`
<table><tr><th>Non-reflexive</th><th>Reflexive</th></tr>
<tr><td>dormir — to sleep</td><td>dormirse — to fall asleep</td></tr>
<tr><td>ir — to go</td><td>irse — to leave</td></tr>
<tr><td>llamar — to call</td><td>llamarse — to be named</td></tr>
<tr><td>poner — to put</td><td>ponerse — to put on / to become</td></tr></table>`},
{h:'Uso recíproco y colocación', body:`
<p>Con sujetos plurales, "se" puede significar "el uno al otro": <code>Nos vemos todos los días.</code></p>
<p>Colocación igual que siempre: <code>Me voy a duchar</code> = <code>Voy a ducharme</code>.</p>`, hEn:'Reciprocal use and placement', bodyEn:`<p>With plural subjects, "se" can mean "each other": <code>Nos vemos todos los días.</code> We see each other every day.</p>
<p>Placement is the same as always: <code>Me voy a duchar</code> = <code>Voy a ducharme</code> — both mean "I’m going to shower."</p>`}
],
practice:[
 {q:'Conjuga "levantarse" para "yo":', options:['Levanto','Me levanto','Se levanta','Te levantas'], correct:1, explain:'La primera persona singular del pronombre reflexivo es "me": "me levanto".'},
 {q:'"Ellos ___ visten para la fiesta."', options:['se','les','los','le'], correct:0, explain:'Tercera persona plural reflexiva → "se visten".'},
 {q:'¿Cuál es la diferencia entre "duermo" y "me duermo"?', options:['No hay diferencia','"Duermo" = estoy dormido; "me duermo" = empiezo a dormirme','"Me duermo" es incorrecto','"Duermo" es reflexivo'], correct:1, explain:'"Dormir" describe el estado; "dormirse" describe el momento de quedarse dormido.'},
 {q:'¿Cuál de estas formas es incorrecta?', options:['Voy a ducharme.','Me voy a duchar.','Voy a me duchar.','Me ducho ahora.'], correct:2, explain:'El pronombre no puede ir suelto entre "a" y el infinitivo.'},
 {q:'"Nosotros nos llamamos todos los días" probablemente significa:', options:['Nos ponemos el mismo nombre','Nos telefoneamos mutuamente cada día','Nadie se llama','Un error gramatical'], correct:1, explain:'Este es el uso recíproco: "el uno al otro".'},
 {q:'"¿A qué hora ___ despiertas?"', options:['te','se','le','nos'], correct:0, explain:'Segunda persona singular ("tú") reflexiva → "te despiertas".'},
 {q:'"Yo" + ponerse (presente, "to become nervous") =', options:['Pongo nervioso','Me pongo nervioso','Se pone nervioso','Ponme nervioso'], correct:1, explain:'"Ponerse" en sentido de "volverse/to become" es reflexivo: me pongo nervioso.'},
 {q:'"Ella" + irse (presente) =', options:['Va','Se va','Va se','Le va'], correct:1, explain:'"Irse" (to leave) requiere el reflexivo "se": se va.'},
 {q:'"Nosotros" + cepillarse los dientes (presente) =', options:['Cepillamos los dientes','Nos cepillamos los dientes','Se cepillan los dientes','Te cepillas los dientes'], correct:1, explain:'Primera persona plural reflexiva: nos cepillamos.'},
 {q:'"Mi hermano se llama Pablo" — ¿qué tipo de "se" es?', options:['Reflexivo verdadero (se nombra a sí mismo)','Recíproco','Pasivo','Impersonal'], correct:0, explain:'"Llamarse" cambia de significado con el reflexivo: to be named — técnicamente reflexivo en su forma, aunque el significado es idiomático.'},
]},

{id:'u4', level:'A2', num:4, title:'El pretérito (verbos regulares e irregulares)',
lessonCards:[
{h:'La idea en una frase', body:`<p>El pretérito cuenta acciones del pasado que ya terminaron, con principio y fin claros.</p>`, hEn:'The idea in one line', bodyEn:`<p>The preterite tells about past actions that are already finished, with a clear beginning and end.</p>`},
{h:'Terminaciones regulares', body:`
<table><tr><th></th><th>-AR (hablar)</th><th>-ER/-IR (comer / vivir)</th></tr>
<tr><td>yo</td><td>hablé</td><td>comí / viví</td></tr>
<tr><td>tú</td><td>hablaste</td><td>comiste / viviste</td></tr>
<tr><td>él/ella/Ud.</td><td>habló</td><td>comió / vivió</td></tr>
<tr><td>nosotros</td><td>hablamos</td><td>comimos / vivimos</td></tr>
<tr><td>ellos/Uds.</td><td>hablaron</td><td>comieron / vivieron</td></tr></table>`, hEn:'Regular endings', bodyEn:`
<table><tr><th></th><th>-AR (hablar)</th><th>-ER/-IR (comer / vivir)</th></tr>
<tr><td>yo</td><td>hablé</td><td>comí / viví</td></tr>
<tr><td>tú</td><td>hablaste</td><td>comiste / viviste</td></tr>
<tr><td>él/ella/Ud.</td><td>habló</td><td>comió / vivió</td></tr>
<tr><td>nosotros</td><td>hablamos</td><td>comimos / vivimos</td></tr>
<tr><td>ellos/Uds.</td><td>hablaron</td><td>comieron / vivieron</td></tr></table>`},
{h:'Cambios ortográficos (solo "yo")', body:`
<ul class="tight">
<li>-car → qu: buscar → <strong>busqué</strong></li>
<li>-gar → gu: llegar → <strong>llegué</strong></li>
<li>-zar → c: empezar → <strong>empecé</strong></li>
</ul>`, hEn:'Spelling changes (only "yo")', bodyEn:`
<ul class="tight">
<li>-car → qu: buscar (to look for) → <strong>busqué</strong></li>
<li>-gar → gu: llegar (to arrive) → <strong>llegué</strong></li>
<li>-zar → c: empezar (to start) → <strong>empecé</strong></li>
</ul>
<p>These changes just preserve the original sound before -é.</p>`},
{h:'Tres grupos irregulares', body:`
<table><tr><th>Grupo</th><th>Verbos</th><th>Raíz</th></tr>
<tr><td>U-stem</td><td>tener, estar, poder, poner, saber, andar</td><td>tuv-, estuv-, pud-, pus-, sup-, anduv-</td></tr>
<tr><td>I-stem</td><td>hacer, querer, venir</td><td>hic-/hiz-, quis-, vin-</td></tr>
<tr><td>J-stem</td><td>decir, traer, conducir</td><td>dij-, traj-, conduj- (sin "i": dijeron)</td></tr></table>
<p>Todos comparten las mismas terminaciones: -e, -iste, -o, -imos, -isteis, -ieron (sin acentos).</p>`, hEn:'Three irregular groups', bodyEn:`
<table><tr><th>Group</th><th>Verbs</th><th>Stem</th></tr>
<tr><td>U-stem</td><td>tener, estar, poder, poner, saber, andar</td><td>tuv-, estuv-, pud-, pus-, sup-, anduv-</td></tr>
<tr><td>I-stem</td><td>hacer, querer, venir</td><td>hic-/hiz-, quis-, vin-</td></tr>
<tr><td>J-stem</td><td>decir, traer, conducir</td><td>dij-, traj-, conduj- (drops the "i": dijeron)</td></tr></table>
<p>All of these share the same endings: -e, -iste, -o, -imos, -isteis, -ieron (no accent marks).</p>`},
{h:'Los especiales', body:`
<div class="note"><strong>Ser / ir</strong> — idénticos: <code>fui, fuiste, fue, fuimos, fuisteis, fueron</code>.<br>
<strong>Dar / ver</strong> — sin tilde: <code>di, diste, dio...</code> / <code>vi, viste, vio...</code></div>`, hEn:'The special cases', bodyEn:`<div class="note"><strong>Ser / ir</strong> (to be / to go) — identical forms: <code>fui, fuiste, fue, fuimos, fuisteis, fueron</code>.<br>
<strong>Dar / ver</strong> (to give / to see) — no accent marks: <code>di, diste, dio...</code> / <code>vi, viste, vio...</code></div>`}
],

{id:'u5', level:'A2', num:5, title:'El imperfecto',
lessonCards:[
{h:'La idea en una frase', body:`<p>El imperfecto describe el pasado habitual, en curso o de fondo — sin foco en cuándo terminó.</p>`, hEn:'The idea in one line', bodyEn:`<p>The imperfect describes habitual, ongoing, or background actions in the past — with no focus on when they ended.</p>`},
{h:'Terminaciones regulares', body:`
<table><tr><th></th><th>-AR (hablar)</th><th>-ER/-IR (comer / vivir)</th></tr>
<tr><td>yo</td><td>hablaba</td><td>comía / vivía</td></tr>
<tr><td>nosotros</td><td>hablábamos</td><td>comíamos / vivíamos</td></tr>
<tr><td>ellos/Uds.</td><td>hablaban</td><td>comían / vivían</td></tr></table>
<div class="note">Solo tres irregulares en todo el imperfecto: <code>ser → era</code> · <code>ir → iba</code> · <code>ver → veía</code>.</div>`, hEn:'Regular endings', bodyEn:`
<table><tr><th></th><th>-AR (hablar)</th><th>-ER/-IR (comer / vivir)</th></tr>
<tr><td>yo</td><td>hablaba</td><td>comía / vivía</td></tr>
<tr><td>nosotros</td><td>hablábamos</td><td>comíamos / vivíamos</td></tr>
<tr><td>ellos/Uds.</td><td>hablaban</td><td>comían / vivían</td></tr></table>
<div class="note">Only three irregulars in the whole imperfect tense: <code>ser → era</code> (was) · <code>ir → iba</code> (was going) · <code>ver → veía</code> (used to see).</div>`},
{h:'¿Cuándo se usa?', body:`
<ul class="tight">
<li><strong>Hábito:</strong> Todos los días caminaba al trabajo.</li>
<li><strong>Fondo/descripción:</strong> Hacía sol y el cielo estaba azul.</li>
<li><strong>En curso, sin final marcado:</strong> Mientras cenábamos, sonó el teléfono.</li>
<li><strong>Hora y edad en el pasado:</strong> Eran las tres. Tenía diez años.</li>
</ul>`, hEn:'When is it used?', bodyEn:`
<ul class="tight">
<li><strong>Habit:</strong> Todos los días caminaba al trabajo. I used to walk to work every day.</li>
<li><strong>Background/description:</strong> Hacía sol y el cielo estaba azul. It was sunny and the sky was blue.</li>
<li><strong>Ongoing, no clear end:</strong> Mientras cenábamos, sonó el teléfono. While we were having dinner, the phone rang.</li>
<li><strong>Time and age in the past:</strong> Eran las tres. Tenía diez años. It was three o’clock. She was ten years old.</li>
</ul>`},
{h:'Palabras clave', body:`
<p><strong>Imperfecto:</strong> siempre, todos los días, normalmente, mientras, de niño/a, a menudo.</p>
<div class="warn"><strong>Pretérito</strong> usa lo opuesto: ayer, de repente, una vez, anoche, el año pasado.</div>`, hEn:'Key words', bodyEn:`<p><strong>Imperfect:</strong> siempre (always), todos los días (every day), normalmente (normally), mientras (while), de niño/a (as a child), a menudo (often).</p>
<div class="warn"><strong>Preterite</strong> uses the opposite kind of cue: ayer (yesterday), de repente (suddenly), una vez (once), anoche (last night), el año pasado (last year).</div>`}
],
practice:[
 {q:'"Yo" + jugar (imperfecto) =', options:['Jugé','Jugaba','Jugué','Jugo'], correct:1, explain:'Terminación regular -aba: jugaba.'},
 {q:'"Nosotros" + ser (imperfecto) =', options:['Somos','Fuimos','Éramos','Eramos'], correct:2, explain:'"Ser" es irregular en el imperfecto: éramos (con tilde).'},
 {q:'¿Qué palabra clave sugiere el imperfecto?', options:['ayer','de repente','todos los días','una vez'], correct:2, explain:'"Todos los días" señala hábito → imperfecto.'},
 {q:'"Ella ___ diez años cuando se mudó a España."', options:['tuvo','tenía','tiene','tendría'], correct:1, explain:'La edad en el pasado se expresa con el imperfecto: tenía.'},
 {q:'"___ las tres de la tarde." (hora en el pasado)', options:['Fueron','Eran','Son','Serían'], correct:1, explain:'La hora en el pasado siempre usa el imperfecto de "ser": eran.'},
 {q:'"Yo" + ver (imperfecto) =', options:['Vía','Veía','Vi','Veo'], correct:1, explain:'"Ver" conserva la "e" del infinitivo: veía.'},
 {q:'"De niños, nosotros ___ (jugar) en el parque cada tarde."', options:['jugamos','jugábamos','jugaremos','juguemos'], correct:1, explain:'Hábito repetido en la niñez → imperfecto: jugábamos.'},
 {q:'"Hacía mucho frío" describe:', options:['un evento puntual','el clima como fondo de una escena','una acción completada','una orden'], correct:1, explain:'Describir el clima o el ambiente es un uso clásico del imperfecto.'},
 {q:'"Tú" + ir (imperfecto) =', options:['Fuiste','Ibas','Vas','Irías'], correct:1, explain:'"Ir" es irregular en el imperfecto: ibas.'},
 {q:'¿Cuál oración usa correctamente el imperfecto?', options:['Ayer estudiaba toda la noche.','Cuando era joven, estudiaba mucho.','La semana pasada estudiaba para el examen.','De repente estudiaba.'], correct:1, explain:'"Cuando era joven" marca un período habitual, no un momento puntual: estudiaba encaja bien.'},
]},
];

{id:'u6', level:'B1', num:6, title:'Pretérito vs. imperfecto en contexto',
lessonCards:[
{h:'La idea en una frase', body:`<p>No es una lista de palabras clave — es una decisión sobre cómo ves la acción: ¿fondo o evento?</p>`, hEn:'The idea in one line', bodyEn:`<p>It’s not a list of keywords to memorize — it’s a decision about how you see the action: background, or event?</p>`},
{h:'Dos maneras de ver el pasado', body:`
<table><tr><th>Pretérito</th><th>Imperfecto</th></tr>
<tr><td>Principio y fin claros</td><td>En curso, sin foco en el final</td></tr>
<tr><td>Avanza la historia</td><td>Describe el fondo/la escena</td></tr>
<tr><td>Evento único o contado</td><td>Hábito repetido indefinidamente</td></tr></table>`, hEn:'Two ways of seeing the past', bodyEn:`
<table><tr><th>Preterite</th><th>Imperfect</th></tr>
<tr><td>Clear beginning and end</td><td>Ongoing, no focus on the end</td></tr>
<tr><td>Moves the story forward</td><td>Describes the background/scene</td></tr>
<tr><td>A single or counted event</td><td>A habit repeated indefinitely</td></tr></table>`},
{h:'El patrón clásico', body:`
<div class="note">El imperfecto pinta la escena; el pretérito narra lo que pasó dentro de ella.<br>
<code>Dormía tranquilamente cuando sonó el teléfono.</code></div>`, hEn:'The classic pattern', bodyEn:`<div class="note">The imperfect paints the scene; the preterite narrates what happened inside it.<br>
<code>Dormía tranquilamente cuando sonó el teléfono.</code> I was sleeping peacefully when the phone rang.</div>`},
{h:'Verbos que cambian de sentido', body:`
<table><tr><th>Verbo</th><th>Imperfecto</th><th>Pretérito</th></tr>
<tr><td>saber</td><td>sabía (knew)</td><td>supe (found out)</td></tr>
<tr><td>conocer</td><td>conocía (knew)</td><td>conocí (met)</td></tr>
<tr><td>querer</td><td>quería (wanted)</td><td>quise (tried) / no quise (refused)</td></tr>
<tr><td>poder</td><td>podía (was able to)</td><td>pude (managed to) / no pude (failed)</td></tr></table>`, hEn:'Verbs that change meaning', bodyEn:`
<table><tr><th>Verb</th><th>Imperfect</th><th>Preterite</th></tr>
<tr><td>saber</td><td>sabía (knew)</td><td>supe (found out)</td></tr>
<tr><td>conocer</td><td>conocía (knew, was acquainted with)</td><td>conocí (met, for the first time)</td></tr>
<tr><td>querer</td><td>quería (wanted)</td><td>quise (tried) / no quise (refused)</td></tr>
<tr><td>poder</td><td>podía (was able to, in general)</td><td>pude (managed to) / no pude (failed to)</td></tr></table>`}
],
practice:[
 {q:'"Yo ya ___ que ella se mudaba a Madrid." (lo sabía de antes)', options:['supe','sabía','sé','sabré'], correct:1, explain:'Conocimiento continuo, no un momento de descubrimiento → imperfecto: sabía.'},
 {q:'"Ayer ___ que mi vuelo se canceló." (me enteré en ese momento)', options:['sabía','supe','sé','sabré'], correct:1, explain:'"Enterarse en un momento puntual" → pretérito: supe.'},
 {q:'"Yo no ___ ir a la fiesta, así que me quedé en casa." (me negué)', options:['quería','quise','no quise','querría'], correct:2, explain:'"No quise" = me negué activamente (evento puntual).'},
 {q:'"Mientras caminábamos por el parque, ___ a un viejo amigo." (evento puntual)', options:['veíamos','vimos','veremos','vemos'], correct:1, explain:'El encuentro puntual interrumpe la escena en curso → pretérito: vimos.'},
 {q:'"De niña, ella ___ al parque todos los domingos."', options:['fue','iba','va','irá'], correct:1, explain:'Hábito repetido en el pasado → imperfecto: iba.'},
 {q:'"Anoche ___ (yo/conocer) a tu hermano por fin." (primera vez)', options:['conocía','conocí','conozco','conocería'], correct:1, explain:'"Conocer" en pretérito = conocer por primera vez: conocí.'},
 {q:'"Nosotros ___ (poder) terminar el proyecto a tiempo." (lo logramos, evento puntual)', options:['podíamos','pudimos','podemos','podríamos'], correct:1, explain:'"Poder" en pretérito afirmativo = lograr hacer algo: pudimos.'},
 {q:'"Cuando yo tenía quince años, ___ (vivir) en Chile." (situación de fondo, duración habitual)', options:['viví','vivía','vivo','viviré'], correct:1, explain:'Describir una etapa/situación de fondo → imperfecto: vivía.'},
 {q:'"El profesor entró mientras los estudiantes ___ (hablar)."', options:['hablaron','hablaban','hablan','hablarán'], correct:1, explain:'"Hablaban" describe la escena en curso, interrumpida por "entró" (pretérito).'},
 {q:'"Yo no ___ (poder) abrir la puerta anoche." (lo intenté y fallé)', options:['podía','pude','no pude','puedo'], correct:2, explain:'"No pude" = intenté y fallé, un evento puntual.'},
]},

{id:'u7', level:'B1', num:7, title:'El subjuntivo presente: formación y disparadores',
lessonCards:[
{h:'La idea en una frase', body:`<p>El subjuntivo no es un "tiempo" nuevo — aparece cuando el verbo principal expresa deseo, duda, emoción o necesidad sobre otra acción.</p>`, hEn:'The idea in one line', bodyEn:`<p>The subjunctive isn’t a new "tense" — it shows up when the main verb expresses a wish, doubt, emotion, or need about another action.</p>`},
{h:'Cómo se forma', body:`
<p>Toma la forma "yo" del presente, quita la "-o", añade la terminación <strong>opuesta</strong>.</p>
<table><tr><th></th><th>-AR (hablar)</th><th>-ER (comer)</th><th>-IR (vivir)</th></tr>
<tr><td>yo</td><td>hable</td><td>coma</td><td>viva</td></tr>
<tr><td>nosotros</td><td>hablemos</td><td>comamos</td><td>vivamos</td></tr>
<tr><td>ellos/Uds.</td><td>hablen</td><td>coman</td><td>vivan</td></tr></table>`, hEn:'How it’s formed', bodyEn:`
<p>Take the "yo" form of the present tense, drop the "-o," and add the <strong>opposite</strong> ending.</p>
<table><tr><th></th><th>-AR (hablar)</th><th>-ER (comer)</th><th>-IR (vivir)</th></tr>
<tr><td>yo</td><td>hable</td><td>coma</td><td>viva</td></tr>
<tr><td>nosotros</td><td>hablemos</td><td>comamos</td><td>vivamos</td></tr>
<tr><td>ellos/Uds.</td><td>hablen</td><td>coman</td><td>vivan</td></tr></table>`},
{h:'Seis irregulares y los cambios de raíz', body:`
<p><code>ser→sea</code> · <code>estar→esté</code> · <code>dar→dé</code> · <code>ir→vaya</code> · <code>saber→sepa</code> · <code>haber→haya</code></p>
<p>Los verbos <strong>-IR</strong> con cambio de raíz también cambian en nosotros/vosotros: <code>pedir→pida, pidamos</code> · <code>dormir→duerma, durmamos</code>.</p>`, hEn:'Six irregulars and stem changes', bodyEn:`
<p><code>ser→sea</code> · <code>estar→esté</code> · <code>dar→dé</code> · <code>ir→vaya</code> · <code>saber→sepa</code> · <code>haber→haya</code></p>
<p><strong>-IR</strong> verbs with a stem change also change in the nosotros/vosotros forms: <code>pedir→pida, pidamos</code> · <code>dormir→duerma, durmamos</code>.</p>`},
{h:'Los disparadores "WEIRDO"', body:`
<table><tr><th>Categoría</th><th>Ejemplos</th></tr>
<tr><td><strong>W</strong>ishes</td><td>querer que, esperar que</td></tr>
<tr><td><strong>E</strong>motion</td><td>alegrarse de que, temer que</td></tr>
<tr><td><strong>I</strong>mpersonal</td><td>es necesario que, es importante que</td></tr>
<tr><td><strong>R</strong>ecommendation</td><td>recomendar que, pedir que</td></tr>
<tr><td><strong>D</strong>oubt</td><td>dudar que, no creer que</td></tr>
<tr><td><strong>O</strong>jalá</td><td>ojalá (que), siempre</td></tr></table>`, hEn:'The "WEIRDO" triggers', bodyEn:`
<table><tr><th>Category</th><th>Examples</th></tr>
<tr><td><strong>W</strong>ishes</td><td>querer que (to want), esperar que (to hope)</td></tr>
<tr><td><strong>E</strong>motion</td><td>alegrarse de que (to be glad), temer que (to fear)</td></tr>
<tr><td><strong>I</strong>mpersonal</td><td>es necesario que, es importante que (it’s necessary/important that)</td></tr>
<tr><td><strong>R</strong>ecommendation</td><td>recomendar que, pedir que (to recommend/ask that)</td></tr>
<tr><td><strong>D</strong>oubt</td><td>dudar que, no creer que (to doubt, to not believe)</td></tr>
<tr><td><strong>O</strong>jalá</td><td>ojalá (que) — "I hope/wish," always subjunctive</td></tr></table>`},
{h:'La excepción clave', body:`<div class="warn">Certeza afirmativa → indicativo: <code>Creo que tiene razón.</code><br>Pero negada → subjuntivo: <code>No creo que tenga razón.</code></div>`, hEn:'The key exception', bodyEn:`<div class="warn">Affirmative certainty → indicative: <code>Creo que tiene razón.</code> I think he’s right.<br>But negated → subjunctive: <code>No creo que tenga razón.</code> I don’t think he’s right.</div>`}
],
practice:[
 {q:'Quiero que tú ___ (venir) a la fiesta.', options:['vienes','vengas','vienen','venir'], correct:1, explain:'"Querer que" dispara el subjuntivo; "venir" es irregular: yo vengo → que vengas.'},
 {q:'Es necesario que nosotros ___ (estudiar) más.', options:['estudiamos','estudiemos','estudiaremos','estudiábamos'], correct:1, explain:'Expresión impersonal → subjuntivo: estudiemos.'},
 {q:'Dudo que ella ___ (saber) la verdad.', options:['sabe','sepa','sabrá','supo'], correct:1, explain:'"Dudar que" dispara el subjuntivo: sepa.'},
 {q:'Elige la opción correcta: "Creo que ___ razón."', options:['tenga','tiene','tuviera','tener'], correct:1, explain:'"Creer que" en afirmativo expresa certeza → indicativo: tiene.'},
 {q:'Ojalá ___ (llover) mañana.', options:['llueve','llueva','lloverá','llovió'], correct:1, explain:'"Ojalá" siempre requiere subjuntivo: llueva.'},
 {q:'"Yo" + pedir (subjuntivo presente) =', options:['pide','pida','pido','pidiera'], correct:1, explain:'"Pedir" mantiene el cambio de raíz en el subjuntivo: pida.'},
 {q:'Me alegro de que ustedes ___ (estar) aquí.', options:['están','estén','estarán','estuvieron'], correct:1, explain:'Expresión de emoción → subjuntivo; "estar" es irregular: estén.'},
 {q:'"Nosotros" + dormir (subjuntivo presente) =', options:['dormamos','durmamos','duérmanos','dormimos'], correct:1, explain:'Cambio o→u en nosotros/vosotros: durmamos.'},
 {q:'Te recomiendo que ___ (leer) este libro.', options:['lees','leas','leerás','leíste'], correct:1, explain:'"Recomendar que" es una recomendación → subjuntivo: leas.'},
 {q:'Es obvio que ella ___ (tener) razón.', options:['tenga','tiene','tuviera','tendrá'], correct:1, explain:'"Es obvio que" expresa certeza → indicativo: tiene.'},
 {q:'Espero que tú ___ (poder) venir.', options:['puedes','puedas','podrás','pudiste'], correct:1, explain:'"Esperar que" dispara el subjuntivo: puedas.'},
 {q:'"Ellos" + buscar (subjuntivo presente) =', options:['busquen','busquén','buscen','busscan'], correct:0, explain:'-car → qu en todas las formas del subjuntivo: busquen.'},
]},

{id:'u8', level:'B1', num:8, title:'El presente perfecto y el pluscuamperfecto',
lessonCards:[
{h:'La idea en una frase', body:`<p>Ambos tiempos usan "haber" + participio. La diferencia es el punto de referencia: ahora, o antes de otro momento pasado.</p>`, hEn:'The idea in one line', bodyEn:`<p>Both tenses use "haber" (to have) + a past participle. The difference is the reference point: now, or before another point in the past.</p>`},
{h:'El presente perfecto', body:`
<table><tr><th>he</th><th>has</th><th>ha</th><th>hemos</th><th>habéis</th><th>han</th></tr></table>
<p>+ participio (-ado / -ido). Irregulares: <code>hecho, dicho, visto, escrito, puesto, roto, vuelto, muerto, abierto, cubierto</code>.</p>
<div class="note">Uso: pasado con relevancia ahora, o experiencias de vida: <code>He viajado a España.</code></div>`, hEn:'The present perfect', bodyEn:`
<table><tr><th>he</th><th>has</th><th>ha</th><th>hemos</th><th>habéis</th><th>han</th></tr></table>
<p>+ participle (-ado / -ido). Irregular participles: <code>hecho (done), dicho (said), visto (seen), escrito (written), puesto (put), roto (broken), vuelto (returned), muerto (died), abierto (opened), cubierto (covered)</code>.</p>
<div class="note">Used for: past actions relevant now, or life experiences: <code>He viajado a España.</code> I have traveled to Spain.</div>`},
{h:'El pluscuamperfecto', body:`
<table><tr><th>había</th><th>habías</th><th>había</th><th>habíamos</th><th>habíais</th><th>habían</th></tr></table>
<div class="note">Una acción pasada <strong>antes</strong> de otra: <code>Cuando llegué, ella ya había salido.</code></div>`, hEn:'The pluperfect (past perfect)', bodyEn:`
<table><tr><th>había</th><th>habías</th><th>había</th><th>habíamos</th><th>habíais</th><th>habían</th></tr></table>
<div class="note">A past action that happened <strong>before</strong> another one: <code>Cuando llegué, ella ya había salido.</code> When I arrived, she had already left.</div>`},
{h:'Un detalle de colocación', body:`<p>Los pronombres van antes de "haber", nunca en medio: <code>Lo he hecho</code> (no "he lo hecho").</p>`, hEn:'One detail about word order', bodyEn:`<p>Object pronouns go before "haber," never in the middle: <code>Lo he hecho</code> (I have done it) — not "he lo hecho."</p>`}
],

 {q:'"Todavía no ___ (yo/terminar) la tarea." (hasta este momento)', options:['terminé','he terminado','había terminado','terminaba'], correct:1, explain:'Acción incompleta con relevancia en el presente → presente perfecto: he terminado.'},
]},

],

{id:'u12', level:'B1', num:12, title:'El presente perfecto de subjuntivo y el imperfecto de subjuntivo',
lessonCards:[
{h:'La idea en una frase', body:`<p>Son las versiones "pasadas" del subjuntivo — se usan con los mismos disparadores de siempre, pero cuando la acción ya pasó o el contexto es pasado/hipotético.</p>`, hEn:'The idea in one line', bodyEn:`<p>These are the "past" versions of the subjunctive — used with the same triggers as always, but when the action already happened or the context is past/hypothetical.</p>`},
{h:'Presente perfecto de subjuntivo', body:`<p><code>haya / hayas / haya / hayamos / hayáis / hayan</code> + participio.</p>
<div class="note">Disparador en presente + acción ya completada: <code>Espero que hayas terminado la tarea.</code></div>`, hEn:'Present perfect subjunctive', bodyEn:`<p><code>haya / hayas / haya / hayamos / hayáis / hayan</code> + participle.</p>
<div class="note">Present-tense trigger + already-completed action: <code>Espero que hayas terminado la tarea.</code> I hope you have finished the homework.</div>`},
{h:'Imperfecto de subjuntivo: cómo se forma', body:`
<p>Raíz de "ellos" en pretérito, sin "-ron", + <code>-ra</code> (o <code>-se</code>).</p>
<table><tr><th>Verbo</th><th>Pretérito (ellos)</th><th>Imperfecto subj.</th></tr>
<tr><td>hablar</td><td>hablaron</td><td>hablara / hablase</td></tr>
<tr><td>tener</td><td>tuvieron</td><td>tuviera / tuviese</td></tr></table>`, hEn:'Imperfect subjunctive: how it’s formed', bodyEn:`
<p>The "ellos" stem of the preterite, minus "-ron," plus <code>-ra</code> (or <code>-se</code>).</p>
<table><tr><th>Verb</th><th>Preterite (ellos)</th><th>Imperfect subj.</th></tr>
<tr><td>hablar</td><td>hablaron</td><td>hablara / hablase</td></tr>
<tr><td>tener</td><td>tuvieron</td><td>tuviera / tuviese</td></tr></table>`},
{h:'Cuándo se usa', body:`<p>Cuando el disparador está en pasado o condicional: <code>Quería que vinieras.</code></p>`, hEn:'When it’s used', bodyEn:`<p>When the trigger is in the past or conditional: <code>Quería que vinieras.</code> I wanted you to come.</p>`},
{h:'Oraciones con "si"', body:`
<div class="note"><strong>Si + imperfecto de subjuntivo, + condicional</strong> (hipotético): <code>Si tuviera dinero, viajaría por el mundo.</code></div>
<p>Compara con una condición real: <code>Si tengo tiempo, iré.</code> (indicativo en ambas partes)</p>`, hEn:'"Si" (if) clauses', bodyEn:`<div class="note"><strong>Si + imperfect subjunctive, + conditional</strong> (hypothetical): <code>Si tuviera dinero, viajaría por el mundo.</code> If I had money, I would travel the world.</div>
<p>Compare with a real condition: <code>Si tengo tiempo, iré.</code> If I have time, I’ll go. (indicative in both parts)</p>`}
],

{id:'u14', level:'B2', num:14, title:'Por vs. para: dominio completo',
lessonCards:[
{h:'La idea en una frase', body:`<p>"Para" apunta hacia un destino, un propósito o un límite. "Por" mira hacia atrás: una causa, un medio, un intercambio.</p>`, hEn:'The idea in one line', bodyEn:`<p>"Para" points forward: toward a destination, a purpose, a deadline. "Por" looks backward: a cause, a means, an exchange.</p>`},
{h:'PARA', body:`<ul class="tight">
<li><strong>Destino:</strong> Salgo para Madrid.</li>
<li><strong>Plazo:</strong> Lo necesito para el lunes.</li>
<li><strong>Propósito:</strong> Estudio para aprender.</li>
<li><strong>Destinatario:</strong> Este regalo es para ti.</li>
<li><strong>Comparación implícita:</strong> Para ser principiante, habla muy bien.</li>
<li><strong>Empleo:</strong> Trabaja para una empresa internacional.</li>
</ul>`, hEn:'PARA', bodyEn:`
<ul class="tight">
<li><strong>Destination:</strong> Salgo para Madrid. I’m leaving for Madrid.</li>
<li><strong>Deadline:</strong> Lo necesito para el lunes. I need it by Monday.</li>
<li><strong>Purpose:</strong> Estudio para aprender. I study in order to learn.</li>
<li><strong>Recipient:</strong> Este regalo es para ti. This gift is for you.</li>
<li><strong>Implied comparison:</strong> Para ser principiante, habla muy bien. For a beginner, he speaks very well.</li>
<li><strong>Employer:</strong> Trabaja para una empresa internacional. He works for an international company.</li>
</ul>`},
{h:'POR', body:`<ul class="tight">
<li><strong>Duración:</strong> Viví allí por dos años.</li>
<li><strong>Causa:</strong> Llegué tarde por el tráfico.</li>
<li><strong>Medio:</strong> Hablamos por teléfono.</li>
<li><strong>Intercambio:</strong> Pagué veinte dólares por el libro.</li>
<li><strong>A través de:</strong> Caminamos por el parque.</li>
<li><strong>Frecuencia:</strong> Tres veces por semana.</li>
</ul>`, hEn:'POR', bodyEn:`
<ul class="tight">
<li><strong>Duration:</strong> Viví allí por dos años. I lived there for two years.</li>
<li><strong>Cause:</strong> Llegué tarde por el tráfico. I was late because of traffic.</li>
<li><strong>Means:</strong> Hablamos por teléfono. We talked on the phone.</li>
<li><strong>Exchange:</strong> Pagué veinte dólares por el libro. I paid twenty dollars for the book.</li>
<li><strong>Through:</strong> Caminamos por el parque. We walked through the park.</li>
<li><strong>Frequency:</strong> Tres veces por semana. Three times a week.</li>
</ul>`},
{h:'Frases fijas y el truco de examen', body:`
<p><strong>Con por:</strong> por favor, por fin, por eso, por supuesto, por ejemplo.<br><strong>Con para:</strong> para siempre, para colmo, para variar.</p>
<div class="warn"><strong>Truco:</strong> ¿"in order to" / "by [fecha]"? → para. ¿"because of" / "in exchange for"? → por.</div>`, hEn:'Fixed phrases and the exam trick', bodyEn:`<p><strong>With por:</strong> por favor (please), por fin (finally), por eso (that’s why), por supuesto (of course), por ejemplo (for example).<br><strong>With para:</strong> para siempre (forever), para colmo (to top it off), para variar (for a change).</p>
<div class="warn"><strong>Trick:</strong> Can you say "in order to" or "by [a date]"? → para. Can you say "because of" or "in exchange for"? → por.</div>`}
],

{id:'u15', level:'B2', num:15, title:'El subjuntivo en cláusulas adjetivas y adverbiales',
lessonCards:[
{h:'La idea en una frase', body:`<p>El subjuntivo aparece de nuevo cuando describimos algo que no sabemos si existe, o una condición que todavía no ha pasado.</p>`, hEn:'The idea in one line', bodyEn:`<p>The subjunctive comes back when we describe something we don’t know exists, or a condition that hasn’t happened yet.</p>`},
{h:'¿Existe o no existe?', body:`
<table><tr><th>Indicativo (existe, se conoce)</th><th>Subjuntivo (no existe / no se sabe)</th></tr>
<tr><td>Tengo un amigo que habla ruso.</td><td>Busco un amigo que hable ruso.</td></tr>
<tr><td>Hay un restaurante que sirve tapas.</td><td>No hay ninguno que sirva tapas aquí.</td></tr></table>`, hEn:'Does it exist or not?', bodyEn:`
<table><tr><th>Indicative (exists, known)</th><th>Subjunctive (doesn’t exist / unknown)</th></tr>
<tr><td>Tengo un amigo que habla ruso. I have a friend who speaks Russian.</td><td>Busco un amigo que hable ruso. I’m looking for a friend who speaks Russian.</td></tr>
<tr><td>Hay un restaurante que sirve tapas. There’s a restaurant that serves tapas.</td><td>No hay ninguno que sirva tapas aquí. There isn’t one that serves tapas here.</td></tr></table>`},
{h:'Conjunciones que siempre llevan subjuntivo', body:`<p><code>para que, antes de que, con tal de que, a menos que, sin que, en caso de que</code></p>
<div class="note"><code>Te lo explico para que lo entiendas.</code></div>`, hEn:'Conjunctions that always take the subjunctive', bodyEn:`<p><code>para que (so that), antes de que (before), con tal de que (provided that), a menos que (unless), sin que (without), en caso de que (in case)</code></p>
<div class="note"><code>Te lo explico para que lo entiendas.</code> I’m explaining it so that you understand it.</div>`},
{h:'Conjunciones que varían', body:`
<p><code>cuando, en cuanto, tan pronto como, hasta que, mientras, aunque</code></p>
<div class="warn">Hábito o hecho ya ocurrido → indicativo. Futuro/hipotético → subjuntivo.<br><code>Cuando llego a casa, ceno.</code> vs. <code>Cuando llegue a casa, cenaré.</code></div>`, hEn:'Conjunctions that vary', bodyEn:`<p><code>cuando (when), en cuanto (as soon as), tan pronto como (as soon as), hasta que (until), mientras (while), aunque (although/even if)</code></p>
<div class="warn">A habit or already-completed fact → indicative. Future/hypothetical → subjunctive.<br><code>Cuando llego a casa, ceno.</code> (When I get home, I eat dinner — habit) vs. <code>Cuando llegue a casa, cenaré.</code> (When I get home [tomorrow], I’ll eat dinner — future)</div>`},
{h:'El matiz de "aunque"', body:`
<p><strong>+ indicativo</strong> = hecho aceptado. <strong>+ subjuntivo</strong> = hipotético, no confirmado.</p>
<div class="note"><code>Aunque llueve, saldré.</code> (sé que llueve) vs. <code>Aunque llueva, saldré.</code> (no sé si va a llover)</div>`, hEn:'The nuance of "aunque"', bodyEn:`<p><strong>+ indicative</strong> = an accepted fact. <strong>+ subjunctive</strong> = hypothetical, not confirmed.</p>
<div class="note"><code>Aunque llueve, saldré.</code> Although it’s raining [and I know it], I’ll go out. vs. <code>Aunque llueva, saldré.</code> Even if it rains [I don’t know yet], I’ll go out.</div>`}
],
practice:[
 {q:'"Busco un apartamento que ___ (tener) dos habitaciones." (aún no lo he encontrado)', options:['tiene','tenga','tendrá','tenía'], correct:1, explain:'Antecedente hipotético → subjuntivo: tenga.'},
 {q:'"Tengo un apartamento que ___ (tener) dos habitaciones." (ya existe)', options:['tiene','tenga','tuviera','tenía'], correct:0, explain:'Antecedente conocido y específico → indicativo: tiene.'},
 {q:'"Te doy mi número para que me ___ (llamar)."', options:['llamas','llames','llamarás','llamaste'], correct:1, explain:'"Para que" siempre requiere subjuntivo: llames.'},
 {q:'"Cuando ___ (yo/llegar) a casa todos los días, ceno." (hábito)', options:['llego','llegue','llegaré','llegué'], correct:0, explain:'Acción habitual → indicativo: llego.'},
 {q:'"Cuando ___ (yo/llegar) a casa mañana, cenaré." (futuro)', options:['llego','llegue','llegaré','llegué'], correct:1, explain:'Acción futura, aún hipotética → subjuntivo: llegue.'},
 {q:'"Aunque ___ (llover) ahora mismo, seguiremos caminando." (sé que está lloviendo)', options:['llueve','llueva','lloverá','llovía'], correct:0, explain:'Hecho confirmado → indicativo con "aunque": llueve.'},
 {q:'"No hay nadie aquí que ___ (saber) hablar japonés."', options:['sabe','sepa','sabrá','supo'], correct:1, explain:'Antecedente inexistente ("nadie") → subjuntivo: sepa.'},
 {q:'"Saldremos a menos que ___ (nevar)."', options:['nieva','nieve','nevará','nevó'], correct:1, explain:'"A menos que" siempre requiere subjuntivo: nieve.'},
 {q:'"Voy a esperar aquí hasta que ella ___ (llegar)." (todavía no ha pasado)', options:['llega','llegue','llegará','llegó'], correct:1, explain:'"Hasta que" con acción futura/no ocurrida → subjuntivo: llegue.'},
 {q:'"Siempre estudio hasta que ___ (cansarme)." (hábito repetido)', options:['me canso','me canse','me cansaré','me cansé'], correct:0, explain:'Hábito repetido → indicativo: me canso.'},
 {q:'"Necesito una persona que ___ (poder) trabajar los fines de semana." (aún no la he encontrado)', options:['puede','pueda','podrá','pudo'], correct:1, explain:'Antecedente indefinido/hipotético → subjuntivo: pueda.'},
]},

{id:'u16', level:'B2', num:16, title:'El discurso indirecto, conectores y "lo" neutro',
lessonCards:[
{h:'La idea en una frase', body:`<p>Cuando repites lo que alguien dijo, los tiempos verbales retroceden un paso. Y "lo" tiene usos abstractos que no existen en inglés de la misma forma.</p>`, hEn:'The idea in one line', bodyEn:`<p>When you repeat what someone said, the verb tenses shift back one step. And "lo" has abstract uses that don’t exist in quite the same way in English.</p>`},
{h:'El retroceso de tiempos', body:`
<table><tr><th>Cita directa</th><th>Discurso indirecto</th></tr>
<tr><td>presente: "Estoy cansado."</td><td>imperfecto: Dijo que estaba cansado.</td></tr>
<tr><td>pretérito: "Comí."</td><td>pluscuamperfecto: Dijo que había comido.</td></tr>
<tr><td>futuro: "Iré."</td><td>condicional: Dijo que iría.</td></tr>
<tr><td>mandato: "¡Ven!"</td><td>subjuntivo: Me dijo que viniera.</td></tr></table>`, hEn:'The tense shift', bodyEn:`
<table><tr><th>Direct quote</th><th>Reported speech</th></tr>
<tr><td>present: "Estoy cansado." I’m tired.</td><td>imperfect: Dijo que estaba cansado. He said he was tired.</td></tr>
<tr><td>preterite: "Comí." I ate.</td><td>pluperfect: Dijo que había comido. He said he had eaten.</td></tr>
<tr><td>future: "Iré." I’ll go.</td><td>conditional: Dijo que iría. He said he would go.</td></tr>
<tr><td>command: "¡Ven!" Come!</td><td>subjunctive: Me dijo que viniera. He told me to come.</td></tr></table>`},
{h:'Conectores útiles', body:`
<table><tr><th>Función</th><th>Conectores</th></tr>
<tr><td>Contraste</td><td>sin embargo, en cambio</td></tr>
<tr><td>Consecuencia</td><td>por lo tanto, así que</td></tr>
<tr><td>Adición</td><td>además, es más</td></tr>
<tr><td>Causa</td><td>ya que, puesto que</td></tr></table>`, hEn:'Useful connectors', bodyEn:`
<table><tr><th>Function</th><th>Connectors</th></tr>
<tr><td>Contrast</td><td>sin embargo (however), en cambio (on the other hand)</td></tr>
<tr><td>Consequence</td><td>por lo tanto (therefore), así que (so)</td></tr>
<tr><td>Addition</td><td>además (besides), es más (what’s more)</td></tr>
<tr><td>Cause</td><td>ya que, puesto que (since)</td></tr></table>`},
{h:'"Lo" neutro', body:`
<ul class="tight">
<li><strong>lo que</strong> (what): No entiendo lo que dices.</li>
<li><strong>lo + adjetivo</strong> (the ... part): Lo difícil es empezar.</li>
<li><strong>lo de</strong> + sustantivo (that thing about): ¿Sabes lo de la boda?</li>
</ul>`, hEn:'Neutral "lo"', bodyEn:`
<ul class="tight">
<li><strong>lo que</strong> (what) — No entiendo lo que dices. I don’t understand what you’re saying.</li>
<li><strong>lo + adjective</strong> (the ... part) — Lo difícil es empezar. The hard part is starting.</li>
<li><strong>lo de</strong> + noun (that thing about) — ¿Sabes lo de la boda? Do you know about the wedding [thing]?</li>
</ul>`}
],
practice:[
 {q:'Cita directa: "Voy a estudiar." → Discurso indirecto (dijo que):', options:['dijo que va a estudiar','dijo que iba a estudiar','dijo que fue a estudiar','dijo que irá a estudiar'], correct:1, explain:'Presente en la cita → imperfecto en el discurso indirecto: iba.'},
 {q:'Cita directa: "Iré a la fiesta." → Discurso indirecto:', options:['dijo que va a la fiesta','dijo que fue a la fiesta','dijo que iría a la fiesta','dijo que irá a la fiesta'], correct:2, explain:'Futuro en la cita → condicional en el discurso indirecto: iría.'},
 {q:'"Estudié toda la noche, ___ aprobé el examen." (consecuencia)', options:['sin embargo','por lo tanto','además','ya que'], correct:1, explain:'"Por lo tanto" introduce una consecuencia lógica.'},
 {q:'"___ difícil del examen fue la última pregunta." (the hard part)', options:['El','Lo','La','Los'], correct:1, explain:'"Lo + adjetivo" expresa un concepto abstracto: lo difícil.'},
 {q:'"No entiendo ___ quieres decir." (what)', options:['que','lo que','el que','lo'], correct:1, explain:'"Lo que" traduce "what/that which" sin referirse a un sustantivo específico.'},
 {q:'Mandato directo: "¡Cállate!" → Discurso indirecto (me dijo que):', options:['me dijo que me callo','me dijo que me callara','me dijo que me callaré','me dijo que me callé'], correct:1, explain:'Un mandato en discurso indirecto se convierte en imperfecto de subjuntivo: me callara.'},
 {q:'Cita directa: "He terminado el informe." → Discurso indirecto:', options:['dijo que ha terminado el informe','dijo que había terminado el informe','dijo que terminaría el informe','dijo que terminó el informe'], correct:1, explain:'Presente perfecto en la cita → pluscuamperfecto en el discurso indirecto.'},
 {q:'"Me gusta el plan, ___ prefiero empezar el lunes." (contraste suave)', options:['por lo tanto','en cambio','además','ya que'], correct:1, explain:'"En cambio" introduce un contraste suave.'},
 {q:'"___ bueno del viaje fue conocer gente nueva." (the good part)', options:['El','Lo','La','Uno'], correct:1, explain:'"Lo bueno" = the good part/thing, un concepto abstracto.'},
 {q:'"No fuimos a la playa ___ llovía todo el día." (causa)', options:['sin embargo','ya que','por lo tanto','además'], correct:1, explain:'"Ya que" introduce una causa o razón.'},
]},
];

{id:'cu1', level:'HSK2', num:1, title:'Comparisons: 比, 跟...一样, 更, 最',
lessonCards:[
{h:'The core idea', body:`<p>Chinese does not conjugate adjectives for comparison the way English does (no "-er/-est"). Instead, small words like <strong>比 (bǐ)</strong> do the work of "than."</p>`},
{h:'比 (bǐ) — more than', body:`
<p><strong>A + 比 + B + adjective</strong></p>
<div class="note"><code>我比你高。</code> Wǒ bǐ nǐ gāo. — I am taller than you.<br>
<code>今天比昨天冷。</code> Jīntiān bǐ zuótiān lěng. — Today is colder than yesterday.</div>
<p>To say "a little" or "a lot" more, add after the adjective: <code>高一点儿</code> (a little taller), <code>高得多</code> (much taller).</p>`},
{h:'Equal and negative comparison', body:`
<div class="note"><strong>Equal:</strong> A + 跟/和 + B + 一样 (+adj): <code>我跟你一样高。</code> I am as tall as you.<br>
<strong>Not as...as:</strong> A + 没有 + B + (这么/那么) + adj: <code>我没有你那么高。</code> I am not as tall as you.</div>
<div class="warn">You cannot use 比 with 很/非常 in the same clause — 比 already implies comparison, so <code>我比你很高</code> is wrong.</div>`},
{h:'更 (gèng) and 最 (zuì)', body:`
<p><strong>更</strong> — even more (implies something is already X, and this is more so): <code>这个更好。</code> This one is even better.</p>
<p><strong>最</strong> — most (superlative, no comparison target needed): <code>他跑得最快。</code> He runs the fastest.</p>`}
],
practice:[
 {q:'我 ___ 他高。(I am taller than him.)', options:['很','跟','比','最'], correct:2, explain:'比 (bǐ) is the word for "than" in a comparison: 我比他高。'},
 {q:'这本书 ___ 那本书有意思。(This book is as interesting as that one.)', options:['跟...一样','比','更','没有'], correct:0, explain:'"As...as" uses 跟...一样: 这本书跟那本书一样有意思。'},
 {q:'Choose the correct sentence for "I am not as tall as you":', options:['我比你没有高。','我没有你那么高。','我跟你不一样高。','我最没有高。'], correct:1, explain:'没有 + comparison target + 那么/这么 + adjective is the pattern for "not as...as."'},
 {q:'"This one is even more expensive." — 这个 ___ 贵。', options:['很','更','最','跟'], correct:1, explain:'更 (gèng) means "even more" — implying something else is already expensive, and this exceeds it.'},
 {q:'他 ___ 跑得快。(He runs the fastest — no comparison target needed.)', options:['比','更','最','跟'], correct:2, explain:'最 (zuì) is the superlative "most," used without a specific comparison target.'},
 {q:'Which sentence is grammatically wrong?', options:['我比你高一点儿。','我比你很高。','我比你高得多。','我没有你高。'], correct:1, explain:'比 cannot combine with 很 in the same comparison — 比 already carries the comparative meaning.'},
 {q:'"Today is a little colder than yesterday." — pick the correct ending:', options:['今天比昨天冷一点儿。','今天比昨天很冷。','今天跟昨天一样冷一点儿。','今天最冷一点儿。'], correct:0, explain:'比 + adjective + 一点儿 expresses "a little more" of that quality.'},
]},

{id:'cu2', level:'HSK2', num:2, title:'Verb reduplication and 一下: softening the action',
lessonCards:[
{h:'The core idea', body:`<p>Repeating a verb (or adding 一下 after it) makes an action sound brief, casual, or tentative — like saying "take a look" instead of "look."</p>`},
{h:'One-syllable verbs: AA and A一A', body:`
<div class="note"><code>看看</code> or <code>看一看</code> — take a quick look<br><code>想想</code> or <code>想一想</code> — think it over (briefly)<br><code>试试</code> or <code>试一试</code> — give it a try</div>
<p>Both forms mean the same thing; A一A is slightly more common in speech.</p>`},
{h:'Two-syllable verbs: ABAB', body:`
<p>For two-character verbs, repeat the <em>whole</em> word, not each character separately.</p>
<div class="note"><code>讨论讨论</code> (not 讨讨论论) — discuss it a bit<br><code>休息休息</code> — rest for a while</div>`},
{h:'V + 一下: the same softening job', body:`
<p><code>看一下</code>, <code>等一下</code>, <code>想一下</code> all soften the verb the same way reduplication does — pick whichever sounds more natural in the sentence.</p>
<div class="note"><code>等一下！</code> Wait a moment! — one of the most common phrases in spoken Chinese.</div>`}
],
