 {q:'Which pair means the same thing?', options:['看看 and 看一看','看看 and 看不看','看一看 and 不看','看看 and 没看'], correct:0, explain:'看看 and 看一看 are interchangeable — both soften "look" into "take a look."'},
 {q:'"Let\u2019s rest for a bit." — 我们 ___ 吧。', options:['休息休息','休休息息','休息一息','息休息休'], correct:0, explain:'休息 reduplicates as a whole unit: 休息休息.'},
 {q:'What does verb reduplication (AA / A一A) generally add to the meaning?', options:['Makes the action sound forceful','Makes the action past tense','Softens the action — brief, casual, tentative','Makes the verb negative'], correct:2, explain:'Reduplication softens a verb, suggesting a brief or casual version of the action.'},
]},

{id:'cu3', level:'HSK2', num:3, title:'Progressive, "already," and frequency',
lessonCards:[
{h:'The core idea', body:`<p>Chinese marks "in progress," "already," and "about to" with small words rather than verb endings — and they combine with time words you already know.</p>`},
{h:'正在/在...(呢): happening right now', body:`
<div class="note"><code>我正在吃饭(呢)。</code> Wǒ zhèngzài chīfàn (ne). — I am eating (right now).<br><code>他在看电视。</code> Tā zài kàn diànshì. — He is watching TV.</div>
<p>呢 at the end is optional — it just adds a conversational tone.</p>`},
{h:'已经...了: already', body:`
<div class="note"><code>我已经吃了。</code> Wǒ yǐjīng chī le. — I have already eaten.</div>
<p>已经 goes before the verb; 了 goes at the end of the clause.</p>`},
{h:'快(要)...了: about to happen', body:`
<div class="note"><code>要下雨了。</code> Yào xiàyǔ le. — It's about to rain.<br><code>他快要毕业了。</code> Tā kuàiyào bìyè le. — He's about to graduate.</div>`},
{h:'Frequency words', body:`
<p>常/经常 (often), 有时候 (sometimes), 一起 (together) — all go <strong>before</strong> the verb.</p>
<div class="note"><code>我们常常一起吃饭。</code> We often eat together.</div>`}
],
practice:[
 {q:'"I am eating right now." — 我 ___ 吃饭。', options:['已经','正在','快要','有时候'], correct:1, explain:'正在 marks an action in progress right now.'},
 {q:'"He has already left." — 他 ___ 走了。', options:['正在','快要','已经','经常'], correct:2, explain:'已经...了 expresses "already."'},
 {q:'"It\u2019s about to rain." — 要 ___ 了。', options:['下雨','下雨了下雨','正在下雨','下雨已经'], correct:0, explain:'要 + verb + 了 expresses "about to happen": 要下雨了。'},
 {q:'"We sometimes watch movies together." — 我们 ___ 一起看电影。', options:['正在','有时候','已经','快要'], correct:1, explain:'有时候 (sometimes) goes before the verb phrase.'},
 {q:'Where does 已经 go in a sentence?', options:['At the very end','Right after 了','Before the verb','After the object'], correct:2, explain:'已经 comes before the verb: 我已经吃了饭。'},
 {q:'Which sentence correctly expresses "He is watching TV right now"?', options:['他看电视正在。','他正在看电视。','他电视正在看。','他已经看电视。'], correct:1, explain:'正在 goes directly before the verb phrase: 他正在看电视。'},
]},

{id:'cu4', level:'HSK2', num:4, title:'Result and simple direction complements',
lessonCards:[
{h:'The core idea', body:`<p>In Chinese, you often need a second word right after the verb to say <em>how</em> the action turned out — did you finish it? Find it? Come in or go out?</p>`},
{h:'Result complements: 完, 好, 到', body:`
<div class="note"><code>吃完了。</code> Chī wán le. — Finished eating.<br><code>做好了。</code> Zuò hǎo le. — Done, properly finished.<br><code>找到了。</code> Zhǎo dào le. — Found it (achieved the goal).</div>
<p>Without the complement, <code>吃了</code> just means "ate" — it doesn't tell you whether the meal was finished.</p>`},
{h:'Simple direction: 来/去 after a verb', body:`
<div class="note"><code>进来！</code> Jìnlái! — Come in!<br><code>出去。</code> Chūqù. — Go out.<br><code>回来了。</code> Huílái le. — [He] came back.</div>
<p>来 (toward the speaker) vs 去 (away from the speaker) — the choice depends on where the speaker is standing.</p>`},
{h:'Negating these', body:`<p>Use 没(有) for the past, and the complement usually disappears: <code>我没找到。</code> I didn't find it. (Not "没找到了")</p>`}
],
practice:[
 {q:'"I finished eating." — 我吃 ___ 了。', options:['完','到','好','去'], correct:0, explain:'完 (wán) marks completion: 吃完了 — finished eating.'},
 {q:'"I found my keys!" — 我 ___ 钥匙了！', options:['找到','找去','找完','找来'], correct:0, explain:'到 marks that the goal of the action ("find") was achieved.'},
 {q:'Standing inside a room, telling someone to enter: which do you say?', options:['出去','进来','回去','出来'], correct:1, explain:'进来 (come in) is correct when the speaker is inside, calling someone toward them.'},
 {q:'"I did not find it." (past, negative)', options:['我没找到了。','我没找到。','我不找到。','我没有找到了。'], correct:1, explain:'In the negative past, 了 drops off: 我没找到。'},
 {q:'"The report is properly finished." — 报告做 ___ 了。', options:['完','好','到','去'], correct:1, explain:'好 (hǎo) here means "properly/satisfactorily done," slightly different in nuance from 完 (just finished).'},
 {q:'Which word choice depends on the position of the speaker?', options:['完 vs 好','到 vs 完','来 vs 去','了 vs 没'], correct:2, explain:'来 (toward the speaker) and 去 (away from the speaker) depend on the speaker\u2019s point of view.'},
]},

{id:'cu5', level:'HSK3', num:5, title:'Aspect markers: 了, 过, 着',
lessonCards:[
{h:'The core idea', body:`<p>These three small words describe how an action relates to time — not "when" it happened, but its <em>shape</em>: completed, ever-experienced, or an ongoing state.</p>`},
{h:'了 (le): completion or change of state', body:`
<div class="note"><code>我吃了。</code> I ate. (completed action)<br><code>我要走了。</code> I'm leaving now. (change of state — wasn't leaving, now is)</div>`},
{h:'过 (guò): "ever" — past experience', body:`
<div class="note"><code>我去过中国。</code> I have been to China (before, at some point).<br><code>我没去过日本。</code> I have never been to Japan.</div>
<p>过 asks "has this ever happened," not "did this happen yesterday."</p>`},
{h:'着 (zhe): an ongoing state', body:`
<div class="note"><code>门开着。</code> The door is open (and stays that way — a resulting state).<br><code>他坐着看书。</code> He is sitting [while] reading.</div>
<div class="warn">着 is not the same as 正在 — 正在 focuses on the action happening now; 着 focuses on a state that persists.</div>`}
],
practice:[
 {q:'"I have been to Beijing before." — 我去 ___ 北京。', options:['了','过','着','在'], correct:1, explain:'过 marks past experience — "have ever been there."'},
 {q:'"I have never eaten Japanese food." — 我没吃 ___ 日本菜。', options:['了','过','着','完'], correct:1, explain:'没 + verb + 过 negates past experience: never have done X.'},
 {q:'"The light is on (and stays on)." — 灯开 ___。', options:['了','过','着','在'], correct:2, explain:'着 describes a persisting state — the light stays on.'},
 {q:'"I\u2019m about to leave now." (change of state, wasn\u2019t about to before)', options:['我走过。','我走了。','我要走了。','我在走。'], correct:2, explain:'要...了 signals an imminent change of state: about to happen now.'},
 {q:'Which best describes the function of 过?', options:['Marks an ongoing state','Asks whether something has ever happened','Marks a future action','Marks a location'], correct:1, explain:'过 marks whether an action has ever occurred, regardless of when.'},
 {q:'"He is standing, reading a book." (ongoing posture + action)', options:['他站了看书。','他站过看书。','他站着看书。','他站在看书。'], correct:2, explain:'着 links an ongoing posture/state (standing) to a simultaneous action (reading).'},
 {q:'Which sentence correctly uses 了 for a completed action?', options:['我吃过饭。(implying: ever eaten)','我吃着饭。','我吃了饭。','我吃在饭。'], correct:2, explain:'了 directly after the verb marks the action as completed: 我吃了饭 — I ate.'},
]},

{id:'cu6', level:'HSK3', num:6, title:'把 (bǎ) and 被 (bèi): moving and receiving the action',
lessonCards:[
{h:'The core idea', body:`<p>Both restructure a normal sentence to highlight what happens <em>to</em> an object — 把 puts the object first to show it being handled a specific way; 被 puts the receiver first to show it being acted upon.</p>`},
{h:'把 (bǎ): the disposal construction', body:`
<p><strong>Subject + 把 + Object + Verb + [more — a result, complement, or 了]</strong></p>
<div class="note"><code>我把书放在桌子上。</code> I put the book on the table.<br><code>请把门关上。</code> Please close the door.</div>
<div class="warn">A bare verb after 把 is not enough — you always need something after it (a complement, 了, a duplicated verb...). <code>我把书放</code> is incomplete.</div>`},
{h:'When to use 把', body:`<p>Use it when the object is specifically moved, changed, or dealt with in a defined way — especially with verbs like 放 (place), 关 (close), 打开 (open), 拿 (take), 写完 (finish writing).</p>`},
{h:'被 (bèi): the passive voice', body:`
<p><strong>Receiver + 被 + (agent) + Verb + complement</strong></p>
<div class="note"><code>杯子被我打破了。</code> The cup was broken by me.<br><code>他被老师批评了。</code> He was criticized by the teacher.</div>
<p>The agent (被 + who did it) is optional: <code>杯子被打破了。</code> The cup got broken.</p>`}
],
practice:[
 {q:'"Please close the door." — 请 ___ 门关上。', options:['被','把','在','了'], correct:1, explain:'把 fronts the object (门) before the verb + result complement (关上).'},
 {q:'Which sentence is grammatically incomplete?', options:['我把书放在桌子上。','我把书放。','我把书放好了。','我把书打开了。'], correct:1, explain:'A bare verb after 把 with nothing following is incomplete — 把 requires a complement or 了 after the verb.'},
 {q:'"The cup was broken by me." — 杯子 ___ 我打破了。', options:['把','被','在','跟'], correct:1, explain:'被 fronts the receiver of the action (杯子) and marks the passive: 杯子被我打破了。'},
 {q:'"He was praised by the teacher." — 他 ___ 老师表扬了。', options:['把','被','给','跟'], correct:1, explain:'被 marks the passive voice, with the agent (老师) optional after it.'},
 {q:'"I put the keys on the table." — 我 ___ 钥匙放在桌子上。', options:['被','把','在','了'], correct:1, explain:'把 is used because the object (钥匙) is specifically moved/placed somewhere.'},
 {q:'Can the agent after 被 be omitted?', options:['No, it is always required','Yes — "被打破了" (it got broken) is fine without naming who did it','Only in questions','Only with 把'], correct:1, explain:'The agent after 被 is optional; 杯子被打破了 is a complete, natural sentence.'},
 {q:'"I have finished writing the report." — 我 ___ 报告写完了。', options:['被','把','在','跟'], correct:1, explain:'把 highlights the object (报告) being specifically dealt with — finished being written.'},
]},

{id:'cu7', level:'HSK3', num:7, title:'比较 (bǐjiào), 更, and 太...了 revisited',
lessonCards:[
{h:'The core idea', body:`<p>比较 and 更 both mean something like "more," but they answer different questions — one is relative, the other is a step up from a baseline.</p>`},
{h:'比较 (bǐjiào): relatively, fairly', body:`
<div class="note"><code>这个比较贵。</code> This is relatively expensive. (no specific comparison target — just "fairly expensive" in general)</div>`},
{h:'更 (gèng): even more than [something already noted]', body:`
<div class="note"><code>那个也很贵，但这个更贵。</code> That one is expensive too, but this one is even more expensive.</div>
<p>更 implies a baseline that\u2019s being exceeded; 比较 doesn\u2019t need one.</p>`},
{h:'太...了: too much', body:`
<div class="note"><code>太贵了！</code> Too expensive!</div>
<p>Always ends with 了 — it's a complaint or strong reaction, not a neutral description.</p>`},
{h:'没有...那么/这么: not as...as', body:`<div class="note"><code>这个没有那个那么贵。</code> This one isn\u2019t as expensive as that one.</div>`}
],
practice:[
 {q:'"This one is relatively cheap." (no specific comparison implied) — 这个 ___ 便宜。', options:['更','比较','太','没有'], correct:1, explain:'比较 expresses "relatively/fairly" without needing a specific comparison target.'},
 {q:'"That one is expensive, but this one is even more expensive." — 这个 ___ 贵。', options:['比较','更','太','没有'], correct:1, explain:'更 implies exceeding an already-established baseline of expensiveness.'},
 {q:'"Too expensive!" (a complaint)', options:['太贵。','太贵了！','更贵了！','比较贵了！'], correct:1, explain:'太...了 is the pattern for "too much," typically as a reaction/complaint.'},
 {q:'"This one isn\u2019t as good as that one." — 这个 ___ 那个那么好。', options:['更','太','没有','比较'], correct:2, explain:'没有...那么 expresses "not as...as."'},
 {q:'Which best distinguishes 更 from 比较?', options:['更 needs an implied baseline being exceeded; 比较 does not','They are always interchangeable','比较 is only used in questions','更 is only for negative sentences'], correct:0, explain:'更 says "even more than [something]"; 比较 just says "fairly/relatively," with no implied baseline.'},
]},

{id:'cu8', level:'HSK3', num:8, title:'Connectors: 一边...一边, 先...再, 才/就, 又...又, 虽然...但是',
lessonCards:[
{h:'The core idea', body:`<p>These connectors sequence, contrast, and time actions — several are common in everyday speech, so getting the order right matters a lot.</p>`},
{h:'一边...一边... and 先...再...', body:`
<div class="note"><strong>Simultaneous:</strong> <code>他一边吃饭一边看手机。</code> He eats while looking at his phone.<br>
<strong>Sequence:</strong> <code>先做作业，再玩游戏。</code> Do homework first, then play.</div>`},
{h:'才 (cái) vs 就 (jiù): later than expected vs sooner than expected', body:`
<div class="note"><code>他八点才来。</code> He didn\u2019t come until 8 (seen as late).<br><code>他八点就来了。</code> He came as early as 8 (seen as early).</div>
<div class="warn">才 and 就 flip the same fact (8 o'clock) into "late" or "early" depending on which word is used.</div>`},
{h:'又...又... and 虽然...但是...', body:`
<div class="note"><strong>Both...and:</strong> <code>这个又便宜又好。</code> This is both cheap and good.<br><strong>Although...but:</strong> <code>虽然很累，但是很开心。</code> Although tired, [I\u2019m] happy.</div>`}
],
practice:[
 {q:'"He eats while watching TV." — 他 ___ 吃饭 ___ 看电视。', options:['先...再','一边...一边','虽然...但是','又...又'], correct:1, explain:'一边...一边... expresses two simultaneous actions.'},
 {q:'"First do your homework, then play." — ___ 做作业，___ 玩。', options:['一边...一边','先...再','才...就','又...又'], correct:1, explain:'先...再... sequences two actions: first...then.'},
 {q:'"He came as early as 7 o\u2019clock." — 他七点 ___ 来了。', options:['才','就','再','又'], correct:1, explain:'就 marks something as happening sooner than expected: as early as 7.'},
 {q:'"He didn\u2019t arrive until 9 o\u2019clock." — 他九点 ___ 到。', options:['就','才','再','先'], correct:1, explain:'才 marks something as later than expected: not until 9.'},
 {q:'"This restaurant is both cheap and delicious." — 这家饭馆 ___ 便宜 ___ 好吃。', options:['先...再','一边...一边','又...又','才...就'], correct:2, explain:'又...又... links two simultaneous qualities: both...and.'},
 {q:'"Although it was raining, we still went out." — ___ 下雨，___ 我们还是出去了。', options:['先...再','虽然...但是','一边...一边','又...又'], correct:1, explain:'虽然...但是... expresses "although...but."'},
 {q:'Which word implies something happened later than expected?', options:['就','才','再','又'], correct:1, explain:'才 (cái) implies lateness relative to expectation.'},
]},
];

const ZH_UNITS2 = [
{id:'cu9', level:'HSK4', num:9, title:'因为...所以, 如果...就, 除了...以外, 不管...都',
lessonCards:[
{h:'The core idea', body:`<p>These build the logical backbone of a sentence: cause, condition, exception, and "no matter what."</p>`},
{h:'因为...所以... and 如果...就...', body:`
<div class="note"><strong>Because...so:</strong> <code>因为下雨，所以我没去。</code> Because it rained, so I didn\u2019t go.<br>
<strong>If...then:</strong> <code>如果你有空，就来吧。</code> If you\u2019re free, then come.</div>
<p>In casual speech, you can often drop 因为 or 所以 (not both) — but 如果...就 usually stays paired.</p>`},
{h:'除了...以外: two opposite meanings', body:`
<div class="note"><strong>+ 还/也 = "besides" (adding):</strong> <code>除了苹果以外，我还喜欢香蕉。</code> Besides apples, I also like bananas.<br>
<strong>+ 都 = "except" (excluding):</strong> <code>除了他以外，大家都来了。</code> Except for him, everyone came.</div>
<div class="warn">The word after 以外 — 还/也 vs 都 — is what tells you whether it means "besides" or "except."</div>`},
{h:'不管...都...: no matter what', body:`<div class="note"><code>不管你说什么，我都不同意。</code> No matter what you say, I still don\u2019t agree.</div>
<p>The clause after 不管 is usually a question word (什么, 谁, 怎么) or an "A还是B" choice.</p>`}
],
practice:[
 {q:'"Because it rained, I didn\u2019t go." — ___ 下雨，___ 我没去。', options:['如果...就','因为...所以','虽然...但是','不管...都'], correct:1, explain:'因为...所以... expresses cause and effect: because...so.'},
 {q:'"If you have time, come." — ___ 你有时间，___ 来吧。', options:['因为...所以','如果...就','除了...以外','不管...都'], correct:1, explain:'如果...就... expresses a condition: if...then.'},
 {q:'"Besides apples, I also like bananas." — 除了苹果以外，我 ___ 喜欢香蕉。', options:['都','还','就','才'], correct:1, explain:'还 after 除了...以外 signals "besides/also" (adding to the list).'},
 {q:'"Except for him, everyone came." — 除了他以外，大家 ___ 来了。', options:['还','也','都','就'], correct:2, explain:'都 after 除了...以外 signals "except" (excluding him from the group).'},
 {q:'"No matter what you say, I won\u2019t agree." — 不管你说什么，我 ___ 不同意。', options:['就','才','都','还'], correct:2, explain:'都 pairs with 不管 to mean "regardless, still."'},
 {q:'Which word after 除了...以外 changes the meaning from "besides" to "except"?', options:['还 → 都','都 → 还','就 → 才','才 → 就'], correct:0, explain:'还/也 = besides (adding); 都 = except (excluding).'},
 {q:'"No matter whether you agree or not, I\u2019m going." — 不管你同意不同意，我 ___ 要去。', options:['都','就','才','也'], correct:0, explain:'不管 pairs with 都: regardless of the condition, the result still holds.'},
]},

{id:'cu10', level:'HSK4', num:10, title:'只要...就 vs 只有...才: two kinds of "if"',
lessonCards:[
{h:'The core idea', body:`<p>Both connect a condition to a result — but one says "this is enough," and the other says "this is the only way."</p>`},
{h:'只要...就...: a sufficient condition', body:`
<div class="note"><code>只要你努力，就能成功。</code> As long as you work hard, you can succeed.</div>
<p>Implies: working hard is <em>enough</em> — there may be other paths too, but this one works.</p>`},
{h:'只有...才...: a necessary condition', body:`
<div class="note"><code>只有努力，才能成功。</code> Only by working hard can you succeed.</div>
<p>Implies: this is the <em>only</em> way — without it, success is impossible.</p>`},
{h:'Telling them apart', body:`<div class="warn">Ask: is this ONE way among possibly several (只要...就), or the ONLY way (只有...才)? English "only if" often maps to 只有...才, not 只要...就.</div>`}
],
practice:[
 {q:'"As long as you study, you will pass." (one sufficient path, not necessarily the only one)', options:['只有你学习，才能通过。','只要你学习，就能通过。','虽然你学习，但是能通过。','因为你学习，所以能通过。'], correct:1, explain:'只要...就... expresses a sufficient condition: this is enough to succeed.'},
 {q:'"Only with a passport can you board the plane." (no other way exists)', options:['只要有护照，就能上飞机。','只有有护照，才能上飞机。','如果有护照，就能上飞机。','因为有护照，所以能上飞机。'], correct:1, explain:'只有...才... expresses a necessary condition: this is the only way.'},
 {q:'What does 只要...就... imply about alternative paths?', options:['There are no alternatives — this is the only way','This is one sufficient way, but others might exist too','It is impossible','It refers only to the past'], correct:1, explain:'只要...就... marks a sufficient condition, not necessarily the sole path to the result.'},
 {q:'"Only by practicing every day can you improve." (necessary condition)', options:['只要每天练习，就能进步。','只有每天练习，才能进步。','虽然每天练习，但是能进步。','因为每天练习，所以能进步。'], correct:1, explain:'只有...才... marks this as the necessary, exclusive condition.'},
 {q:'Which English phrase most often maps to 只有...才?', options:['"As long as..."','"Only if..."','"Even though..."','"Because..."'], correct:1, explain:'"Only if" in English usually signals a necessary condition, matching 只有...才.'},
]},

{id:'cu11', level:'HSK4', num:11, title:'Directional complements and V+起来 / V+下去',
lessonCards:[
{h:'The core idea', body:`<p>Beyond simple 来/去, direction words can stack onto a verb to show a fuller path — and 起来/下去 stretch into "starting" and "continuing" an action.</p>`},
{h:'Complex directional complements', body:`
<p><strong>V + 上/下/进/出/回/过/起 + 来/去</strong></p>
<div class="note"><code>走进来。</code> Walk in (toward the speaker).<br><code>拿出去。</code> Take [it] out (away from the speaker).<br><code>站起来。</code> Stand up.</div>`},
{h:'V + 起来: start to V / a certain angle', body:`
<div class="note"><code>下起雨来了。</code> It started to rain.<br><code>这个问题听起来很简单。</code> This problem sounds simple (from a certain angle/impression).</div>`},
{h:'V + 下去: keep going', body:`<div class="note"><code>请继续说下去。</code> Please continue speaking.<br><code>他坚持跑下去。</code> He kept on running.</div>`}
],
practice:[
 {q:'"Stand up." — 站 ___。', options:['起来','下去','进来','出去'], correct:0, explain:'起来 as a directional complement on 站 means "stand up."'},
 {q:'"It started to rain." — 下 ___ 雨了。', options:['起来','下去','出来','进来'], correct:0, explain:'V+起来 expresses the start of an action: 下起雨来了.'},
 {q:'"This sounds simple." (a certain impression) — 这个 ___ 很简单。', options:['听下去','听起来','听出来','听进去'], correct:1, explain:'V+起来 can express "seems/sounds [from an impression]": 听起来.'},
 {q:'"Please keep talking." — 请继续说 ___。', options:['起来','下去','出来','回来'], correct:1, explain:'V+下去 expresses continuing an ongoing action.'},
 {q:'"Take it outside" (away from the speaker) — 拿 ___。', options:['出来','出去','进来','起来'], correct:1, explain:'出去 (out + away from speaker) fits "take it outside," moving away from the speaker.'},
 {q:'What does V+起来 add when it is NOT about starting an action?', options:['A sense of "seems/from this angle"','A negative meaning','A question marker','A past tense marker'], correct:0, explain:'起来 can also mean "judging by appearance/impression," as in 听起来 (sounds like) or 看起来 (looks like).'},
]},

{id:'cu12', level:'HSK4', num:12, title:'Time words 以前/以后/之前/之后, and 刚...就, 要是...就',
lessonCards:[
{h:'The core idea', body:`<p>These pin an event to a point on the timeline — and a couple of connectors sharpen exactly how close in time two events are.</p>`},
{h:'以前/以后 vs 之前/之后', body:`
<div class="note"><code>三年以前</code> — three years ago<br><code>毕业以后</code> — after graduation<br><code>睡觉之前刷牙。</code> — Brush teeth before sleeping.</div>
<p>之前/之后 are slightly more formal/written; both attach after a time word or a clause.</p>`},
{h:'刚...就...: no sooner than', body:`<div class="note"><code>我刚到，他就走了。</code> I had just arrived when he left. (barely any time between the two events)</div>`},
{h:'要是...就...: casual "if...then"', body:`<div class="note"><code>要是明天下雨，我们就不去了。</code> If it rains tomorrow, we won\u2019t go. (要是 = casual/spoken version of 如果)</div>`}
],
practice:[
 {q:'"Brush your teeth before sleeping." — 睡觉 ___ 刷牙。', options:['以后','之前','以来','起来'], correct:1, explain:'之前 attaches after a clause/time word to mean "before."'},
 {q:'"After graduation, he went abroad." — 毕业 ___，他出国了。', options:['以前','以后','之前','起来'], correct:1, explain:'以后 means "after" [a point in time].'},
 {q:'"I had just arrived when he left." — 我 ___ 到，他 ___ 走了。', options:['先...再','刚...就','才...就','一边...一边'], correct:1, explain:'刚...就... expresses "no sooner than" — barely any gap between the two events.'},
 {q:'"If it rains tomorrow, we won\u2019t go." (casual spoken version)', options:['如果明天下雨，我们就不去了。','要是明天下雨，我们就不去了。','因为明天下雨，所以我们不去了。','虽然明天下雨，但是我们不去了。'], correct:1, explain:'要是...就... is the more casual, spoken equivalent of 如果...就.'},
 {q:'Which pair is more formal/written in register?', options:['以前/以后','之前/之后','刚/就','先/再'], correct:1, explain:'之前/之后 skew slightly more formal or written than 以前/以后, though both are broadly used.'},
]},
];

{id:'cu15', level:'HSK5', num:15, title:'得 (de) complement of degree and potential complements',
lessonCards:[
{h:'The core idea', body:`<p>得 (de) links a verb or adjective to a description of how well, how much, or to what degree — and, in a different pattern, whether something CAN be done.</p>`},
{h:'Complement of degree: V/Adj + 得 + description', body:`
<div class="note"><code>他说得很快。</code> He speaks very fast.<br><code>她高兴得跳了起来。</code> She was so happy she jumped up.</div>
<p>What follows 得 describes the manner or intensity of the action/quality before it.</p>`},
{h:'Potential complement: can/cannot manage to', body:`
<div class="note"><code>我看得懂。</code> I can understand [by looking/reading]. — <code>我看不懂。</code> I can\u2019t understand.<br><code>我做得到。</code> I can manage it. — <code>我做不到。</code> I can\u2019t manage it.</div>
<p>Insert 得 (can) or 不 (cannot) between the verb and its result complement.</p>`},
{h:'Three different "de": 得, 的, 地', body:`
<table><tr><th>得 (de)</th><th>的 (de)</th><th>地 (de)</th></tr>
<tr><td>after verb/adj, before a degree/result description</td><td>possessive / before a noun</td><td>after an adverb, before a verb</td></tr>
<tr><td>说得快</td><td>我的书</td><td>慢慢地走</td></tr></table>`}
],
practice:[
 {q:'"He speaks very fast." — 他说 ___ 很快。', options:['的','地','得','了'], correct:2, explain:'得 links the verb to a description of manner/degree.'},
 {q:'"I can understand it (by reading)." — 我看 ___ 懂。', options:['得','的','地','了'], correct:0, explain:'得 inserted between verb and result complement makes it potential: "can."'},
 {q:'"I can\u2019t manage it." — 我做 ___ 到。', options:['得','不','没','的'], correct:1, explain:'不 inserted between verb and complement makes it "cannot."'},
 {q:'Which "de" goes before a noun to show possession?', options:['得','的','地','没'], correct:1, explain:'的 is the possessive/descriptive particle before nouns: 我的书.'},
 {q:'"She walked over slowly." — 她慢慢 ___ 走过来。', options:['得','的','地','了'], correct:2, explain:'地 follows an adverb (慢慢) and precedes the verb it modifies.'},
 {q:'"So happy she jumped up." — 她高兴 ___ 跳了起来。', options:['的','地','得','了'], correct:2, explain:'得 introduces the degree/result of the emotion: so happy that....'},
]},

 {q:'Which register do 然而, 由于, and 以便 belong to?', options:['Casual spoken Chinese only','Formal, written Chinese (essays, news, reports)','Slang','Children\u2019s speech'], correct:1, explain:'These are written-register connectors, common in essays, news, and formal reports.'},

const vocabCache = {};
function vocabList(track, level, sys){
  const ck = track+level+(sys||'');
  if(vocabCache[ck]) return vocabCache[ck];
  let out = [];
  if(track==='es'){
    ES_THEMES.forEach(t=>{
      (t[level]||'').split('|').filter(Boolean).forEach(pair=>{
        const i = pair.indexOf('=');
        const w = pair.slice(0,i), e = pair.slice(i+1);
        out.push({k:t.id+'|'+w, w, r:'', e, t:t.id});
      });
    });
  } else {
    const L = parseInt(level.replace('HSK',''),10);
    const col = sys==='n' ? 3 : 4;
    ZH_VOCAB.forEach(x=>{ if(x[col]===L) out.push({k:x[0]+'|'+x[1], w:x[0], r:x[1], e:x[2], t:''}); });
  }
  vocabCache[ck] = out;
  return out;
}
function vocabStoreKey(track){ return 'lb-vocab-'+track; }
function loadVocabStore(track){
  try{ const raw = localStorage.getItem(vocabStoreKey(track)); if(raw) return JSON.parse(raw); }catch(e){}
  return {known:{}};
}
const vocabStores = {};
function vStore(track){ if(!vocabStores[track]) vocabStores[track] = loadVocabStore(track); return vocabStores[track]; }
function saveVStore(track){ try{ localStorage.setItem(vocabStoreKey(track), JSON.stringify(vStore(track))); }catch(e){} scheduleSync(); }
function isKnown(track,k){ return !!vStore(track).known[k]; }
function setKnown(track,k,val){ const s=vStore(track); if(!s.known) s.known={}; if(val) s.known[k]=1; else delete s.known[k]; s.knownT=s.knownT||{}; s.knownT[k]=Date.now(); s.t=Date.now(); saveVStore(track); }
function knownCount(track,list){ const s=vStore(track).known; let n=0; list.forEach(x=>{ if(s[x.k]) n++; }); return n; }

let vocabUI = {es:null, zh:null};
function getVUI(track){
  if(!vocabUI[track]){
    const s = vStore(track);
    vocabUI[track] = {level:s.level||VOCAB_CFG[track].defaultLevel, sys:s.sys||'o', mode:'list', q:'', theme:'', onlyNew:false, limit:120, dir:0, deck:null, idx:0, flipped:false, quiz:null};
  }
  return vocabUI[track];
}
function persistVUI(track){ const u=getVUI(track); const s=vStore(track); s.level=u.level; s.sys=u.sys; s.t=Date.now(); saveVStore(track); }

function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function speak(track, text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/^(el|la|los|las) /,'$1 '));
    u.lang = VOCAB_CFG[track].voice; u.rate = track==='zh' ? 0.8 : 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function filteredVocab(track){
  const u = getVUI(track);
  let list = vocabList(track, u.level, u.sys);
  if(u.theme) list = list.filter(x=>x.t===u.theme);
  if(u.onlyNew) list = list.filter(x=>!isKnown(track,x.k));
  const q = u.q.trim().toLowerCase();
  if(q){
    const qn = q.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    list = list.filter(x=>{
      const hay = (x.w+' '+x.r+' '+x.e).toLowerCase();
      return hay.includes(q) || hay.normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(qn);
    });
  }
  return list;
}

function renderVocab(){
  const track = state.track; const vc = VOCAB_CFG[track]; const u = getVUI(track);
  const zhCls = track==='zh' ? 'zh' : '';
  const full = vocabList(track, u.level, u.sys);
  const kn = knownCount(track, full);
  const pct = full.length ? Math.round(kn/full.length*100) : 0;
  const lvlChips = vc.levels.map(lv=>{
    const l = vocabList(track, lv, u.sys); const k = knownCount(track,l);
    return `<button class="lvl-chip ${lv===u.level?'active':''}" data-vlvl="${lv}">${lv} <span class="vchip-n">${k}/${l.length}</span></button>`;
  }).join('');
  const sysRow = track==='zh' ? `<div class="chip-row vsys-row">${['o','n'].map(s=>`<button class="topic-chip2 ${u.sys===s?'active':''}" data-vsys="${s}">${vc.sysLabels[s]}</button>`).join('')}</div>` : '';
  const modeTabs = Object.entries(vc.modes).map(([m,lab])=>`<button class="vmode-tab ${u.mode===m?'active':''}" data-vmode="${m}">${lab}</button>`).join('');
  root.innerHTML = `
  <div class="view vocab-view">
    <div class="crumb"><button data-nav="track:${track}">${TRACKS[track].homeTitle}</button> <span>›</span> <span>${vc.crumb}</span></div>
    <h1 class="${zhCls}" style="font-size:1.5rem;">${vc.title}</h1>
    <p class="vocab-sub">${vc.sub}</p>
    ${sysRow}
    <div class="chip-row" id="vLvlRow">${lvlChips}</div>
    <div class="progress-line"><div class="bar"><i style="width:${pct}%"></i></div><span>${kn} / ${full.length} ${vc.known}</span></div>
    <div class="vmode-tabs">${modeTabs}</div>
    <div id="vocabBody"></div>
  </div>`;
  root.querySelectorAll('[data-vlvl]').forEach(b=>b.onclick=()=>{ u.level=b.dataset.vlvl; u.limit=120; u.deck=null; u.quiz=null; persistVUI(track); renderVocab(); });
  root.querySelectorAll('[data-vsys]').forEach(b=>b.onclick=()=>{ u.sys=b.dataset.vsys; u.limit=120; u.deck=null; u.quiz=null; persistVUI(track); renderVocab(); });
  root.querySelectorAll('[data-vmode]').forEach(b=>b.onclick=()=>{ u.mode=b.dataset.vmode; u.deck=null; u.quiz=null; renderVocab(); });
  if(u.mode==='list') renderVocabList(track);
  else if(u.mode==='cards') renderVocabCards(track);
  else renderVocabQuiz(track);
  attachNavHandlers();
}

function vocabFilterBar(track){
  const vc = VOCAB_CFG[track]; const u = getVUI(track);
  const themeSel = track==='es' ? `<select id="vTheme" class="vselect"><option value="">${vc.allThemes}</option>${ES_THEMES.filter(t=>(t[u.level]||'').length).map(t=>`<option value="${t.id}" ${u.theme===t.id?'selected':''}>${t.es} · ${t.en}</option>`).join('')}</select>` : '';
  return `<div class="vfilter">
    ${u.mode==='list' ? `<input id="vSearch" class="vsearch" type="search" placeholder="${vc.search}" value="${escHtml(u.q)}">` : ''}
    ${themeSel}
    ${u.mode!=='cards' ? `<label class="vcheck"><input type="checkbox" id="vOnlyNew" ${u.onlyNew?'checked':''}> ${vc.onlyNew}</label>` : ''}
  </div>`;
}
function bindFilterBar(track, rerender){
  const u = getVUI(track);
  const s = document.getElementById('vSearch');
  if(s) s.addEventListener('input', ()=>{ u.q = s.value; u.limit=120; rerender(true); });
  const t = document.getElementById('vTheme');
  if(t) t.onchange = ()=>{ u.theme = t.value; u.limit=120; u.deck=null; u.quiz=null; rerender(); };
  const c = document.getElementById('vOnlyNew');
  if(c) c.onchange = ()=>{ u.onlyNew = c.checked; u.limit=120; u.deck=null; u.quiz=null; rerender(); };
}

function vocabRowHtml(track, x){
  const zhCls = track==='zh' ? 'zh' : '';
  const k = isKnown(track,x.k);
  return `<div class="vrow ${k?'known':''}" data-k="${escHtml(x.k)}">
    <div class="vword ${zhCls}">${escHtml(x.w)}${x.r?`<span class="vread">${escHtml(x.r)}</span>`:''}</div>
    <div class="vmean">${escHtml(x.e)}</div>
    <div class="vact">
      <button class="vicon" data-say="${escHtml(x.w)}" aria-label="Listen">🔊</button>
      <button class="vicon vknow ${k?'on':''}" data-toggle="${escHtml(x.k)}" aria-label="Mark as known">✓</button>
    </div>
  </div>`;
}
function renderVocabList(track, keepFocus){
  const vc = VOCAB_CFG[track]; const u = getVUI(track);
  const body = document.getElementById('vocabBody');
  if(!keepFocus || !document.getElementById('vListRows')){
    body.innerHTML = vocabFilterBar(track) + `<div id="vListRows"></div>`;
    bindFilterBar(track, (kf)=> kf ? renderVocabList(track,true) : renderVocabList(track));
  }
  const list = filteredVocab(track);
  const rows = document.getElementById('vListRows');
  if(!list.length){ rows.innerHTML = `<p class="vempty">${vc.empty}</p>`; return; }
  const shown = list.slice(0, u.limit);
  let html = '';
  if(track==='es' && !u.theme && !u.q){
    let cur = null;
    shown.forEach(x=>{
      if(x.t!==cur){ cur=x.t; const t=ES_THEMES.find(z=>z.id===cur); html += `<h3 class="vgroup">${t.es} <span>${t.en}</span></h3>`; }
      html += vocabRowHtml(track,x);
    });
  } else {
    html = shown.map(x=>vocabRowHtml(track,x)).join('');
  }
  if(list.length > u.limit) html += `<button class="secondary-btn vmore" id="vMore">${vc.more} (${list.length-u.limit})</button>`;
  rows.innerHTML = html;
  rows.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(track,b.dataset.say));
  rows.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.toggle; const nv=!isKnown(track,k); setKnown(track,k,nv);
    b.classList.toggle('on',nv); b.closest('.vrow').classList.toggle('known',nv);
    updateVocabProgress(track);
  });
  const more = document.getElementById('vMore');
  if(more) more.onclick = ()=>{ u.limit += 200; renderVocabList(track,true); };
}
function updateVocabProgress(track){
  const u = getVUI(track); const vc = VOCAB_CFG[track];
  const full = vocabList(track,u.level,u.sys); const kn = knownCount(track,full);
  const bar = root.querySelector('.vocab-view .progress-line');
  if(bar){ bar.querySelector('i').style.width = (full.length?Math.round(kn/full.length*100):0)+'%'; bar.querySelector('span').textContent = `${kn} / ${full.length} ${vc.known}`; }
  const chip = root.querySelector(`[data-vlvl="${u.level}"] .vchip-n`);
  if(chip) chip.textContent = `${kn}/${full.length}`;
}

function renderVocabCards(track){
  const vc = VOCAB_CFG[track]; const u = getVUI(track);
  const zhCls = track==='zh' ? 'zh' : '';
  const body = document.getElementById('vocabBody');
  if(!u.deck){
    let base = filteredVocab(track).filter(x=>!isKnown(track,x.k));
    u.deck = shuffle(base); u.idx = 0; u.flipped = false;
  }
  const dirBtns = vc.dirLabel.map((l,i)=>`<button class="topic-chip2 ${u.dir===i?'active':''}" data-vdir="${i}">${l}</button>`).join('');
  let inner;
  if(!u.deck.length || u.idx >= u.deck.length){
    inner = `<div class="vcard done"><p>${vc.deckDone}</p><button class="secondary-btn" id="vReset">${vc.reset}</button></div>`;
  } else {
    const x = u.deck[u.idx];
    const front = u.dir===0
      ? `<div class="vc-big ${zhCls}">${escHtml(x.w)}</div>`
      : `<div class="vc-mid">${escHtml(x.e)}</div>`;
    const back = u.dir===0
      ? `${x.r?`<div class="vc-read">${escHtml(x.r)}</div>`:''}<div class="vc-mid">${escHtml(x.e)}</div>`
      : `<div class="vc-big ${zhCls}">${escHtml(x.w)}</div>${x.r?`<div class="vc-read">${escHtml(x.r)}</div>`:''}`;
    inner = `<div class="vc-count">${u.idx+1} / ${u.deck.length}</div>
      <button class="vcard ${u.flipped?'flipped':''}" id="vCard">
        ${front}
        ${u.flipped ? `<div class="vc-back">${back}</div>` : `<div class="vc-hint">${vc.flip}</div>`}
      </button>
      <div class="vc-actions">
        <button class="vicon vsay" id="vSay" aria-label="Listen">🔊</button>
        <button class="secondary-btn" id="vAgain">${vc.again}</button>
        <button class="primary-btn" id="vKnow">${vc.know}</button>
      </div>`;
  }
  body.innerHTML = vocabFilterBar(track) + `<div class="chip-row">${dirBtns}</div>` + inner;
  bindFilterBar(track, ()=>renderVocabCards(track));
  body.querySelectorAll('[data-vdir]').forEach(b=>b.onclick=()=>{ u.dir=+b.dataset.vdir; u.flipped=false; renderVocabCards(track); });
  const card = document.getElementById('vCard');
  if(card){
    const x = u.deck[u.idx];
    card.onclick = ()=>{ u.flipped=!u.flipped; renderVocabCards(track); };
    document.getElementById('vSay').onclick = ()=>speak(track,x.w);
    document.getElementById('vAgain').onclick = ()=>{ u.deck.push(u.deck.splice(u.idx,1)[0]); u.flipped=false; renderVocabCards(track); };
    document.getElementById('vKnow').onclick = ()=>{ setKnown(track,x.k,true); u.idx++; u.flipped=false; updateVocabProgress(track); renderVocabCards(track); };
  }
  const rs = document.getElementById('vReset');
  if(rs) rs.onclick = ()=>{
    if(!confirm(vc.resetConfirm)) return;
    vocabList(track,u.level,u.sys).forEach(x=>setKnown(track,x.k,false));
    u.deck=null; renderVocab();
  };
}

function renderVocabQuiz(track){
  const vc = VOCAB_CFG[track]; const u = getVUI(track);
  const zhCls = track==='zh' ? 'zh' : '';
  const body = document.getElementById('vocabBody');
  if(!u.quiz){
    body.innerHTML = vocabFilterBar(track) + `<div class="vcard done"><button class="primary-btn" id="vQuizStart">${vc.quizStart}</button></div>`;
    bindFilterBar(track, ()=>renderVocabQuiz(track));
    document.getElementById('vQuizStart').onclick = ()=>{
      const pool = filteredVocab(track);
      const levelPool = vocabList(track,u.level,u.sys);
      if(pool.length < 1){ body.querySelector('.vcard').innerHTML = `<p>${vc.empty}</p>`; return; }
      const qs = shuffle(pool).slice(0,10).map(x=>{
        const distract = shuffle(levelPool.filter(y=>y.e!==x.e && y.k!==x.k)).slice(0,3);
        return {x, opts:shuffle([x,...distract]), pick:null};
      });
      u.quiz = {qs, i:0};
      renderVocabQuiz(track);
    };
    return;
  }
  const qz = u.quiz;
  if(qz.i >= qz.qs.length){
    const right = qz.qs.filter(q=>q.pick===q.x.k).length;
    const review = qz.qs.map(q=>`<div class="review-item"><div class="rq ${zhCls}">${escHtml(q.x.w)} ${q.x.r?`<span class="vread">${escHtml(q.x.r)}</span>`:''}</div><div class="ra ${q.pick===q.x.k?'right':'wrong'}">${escHtml(q.x.e)}</div></div>`).join('');
    body.innerHTML = `<div class="result-hero"><div class="result-score">${right}/${qz.qs.length}</div><div class="result-verdict">${vc.quizScore}</div></div>
      <div class="vc-actions"><button class="secondary-btn" id="vMarkRight">${vc.markRight}</button><button class="primary-btn" id="vQuizAgain">${vc.again2}</button></div>
      <div style="margin-top:1rem;">${review}</div>`;
    document.getElementById('vMarkRight').onclick = (e)=>{ qz.qs.forEach(q=>{ if(q.pick===q.x.k) setKnown(track,q.x.k,true); }); e.target.disabled=true; e.target.textContent='✓'; updateVocabProgress(track); };
    document.getElementById('vQuizAgain').onclick = ()=>{ u.quiz=null; renderVocabQuiz(track); };
    return;
  }
  const q = qz.qs[qz.i];
  const answered = q.pick!==null;
  const opts = q.opts.map(o=>{
    let cls='';
    if(answered){ if(o.k===q.x.k) cls='correct'; else if(o.k===q.pick) cls='incorrect'; }
    return `<button class="opt ${cls}" data-pick="${escHtml(o.k)}" ${answered?'disabled':''}>${escHtml(o.e)}</button>`;
  }).join('');
  body.innerHTML = `<div class="progress-line"><div class="bar"><i style="width:${qz.i/qz.qs.length*100}%"></i></div><span>${qz.i+1} / ${qz.qs.length}</span></div>
    <div class="q-card">
      <div class="vquiz-label">${vc.quizQ}</div>
      <div class="vquiz-word ${zhCls}">${escHtml(q.x.w)} <button class="vicon" id="vQSay" aria-label="Listen">🔊</button></div>
      ${answered && q.x.r ? `<div class="vc-read" style="text-align:left;margin:-.4rem 0 .8rem;">${escHtml(q.x.r)}</div>` : ''}
      ${opts}
      ${answered ? `<div class="q-nav"><span></span><button class="primary-btn" id="vQNext">${qz.i===qz.qs.length-1?vc.finish:vc.next}</button></div>` : ''}
    </div>`;
  document.getElementById('vQSay').onclick = ()=>speak(track,q.x.w);
  body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ q.pick=b.dataset.pick; renderVocabQuiz(track); });
  const nx = document.getElementById('vQNext');
  if(nx) nx.onclick = ()=>{ qz.i++; renderVocabQuiz(track); };
}

/* ---- helpers for assembly ---- */
function qid(q){ let h=0; const s=q.q+'|'+q.options[q.correct]; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return 'q'+(h>>>0).toString(36); }
function fromCompact(a){ return {q:a[0], options:[a[1],...a[2]], correct:0, explain:a[3]}; }
function unitAuthored(u){ return [...u.practice, ...((BANK_EXTRA[u.id]||[]).map(fromCompact))]; }
function shuffleOptions(q){
  const idx = shuffle(q.options.map((_,i)=>i));
  return Object.assign({}, q, {options: idx.map(i=>q.options[i]), correct: idx.indexOf(q.correct)});
}
function getSeen(track){ SYNCED.seen[track] = SYNCED.seen[track] || {}; return SYNCED.seen[track]; }
function pickFresh(track, pool, n){
  const seen = getSeen(track);
  const scored = shuffle(pool).map(q=>({q, t: seen[qid(q)] || 0}));
  scored.sort((a,b)=>a.t-b.t);
  return scored.slice(0,n).map(x=>x.q);
}
function genMany(unitId, n){
  const gens = GEN[unitId] || []; const out=[]; const keys=new Set();
  for(let tries=0; out.length<n && gens.length && tries<n*12; tries++){
    const g = gens[tries % gens.length](); if(!g) continue;
    const k = g.q+'|'+g.options[0]; if(keys.has(k)) continue; keys.add(k); out.push(g);
  }
  return out;
}
function markSeen(track, qs){ const seen=getSeen(track); const now=Date.now(); qs.forEach(q=>{ if(!q.gen) seen[qid(q)] = now; }); }

const UNIT_QUIZ_LEN = 12, UNIT_PASS = 80;
function buildUnitQuiz(track, u){
  const authored = unitAuthored(u);
  const nGen = (GEN[u.id]||[]).length ? 5 : 0;
  const gen = genMany(u.id, nGen);
  const a = pickFresh(track, authored, UNIT_QUIZ_LEN - gen.length);
  return shuffle([...a, ...gen]).map(shuffleOptions);
}
function testUnits(track, t){
  const cfg = TRACKS[track];
  const sorted = cfg.tests.slice().sort((x,y)=>x.afterUnit-y.afterUnit);
  const i = sorted.indexOf(t); const lo = i>0 ? sorted[i-1].afterUnit : 0;
  return cfg.units.filter(u=>u.num>lo && u.num<=t.afterUnit);
}
function buildCheckpoint(track, t){
  const N = t.questions.length;
  const units = testUnits(track, t);
  const chosen = []; const keys = new Set();
  const add = q=>{ const k=q.q+'|'+q.options[q.correct]; if(keys.has(k)) return false; keys.add(k); chosen.push(q); return true; };
  // coverage: every unit in the level contributes at least 2 fresh items (1 generated when available)
  units.forEach(u=>{
    const g = genMany(u.id, 1);
    g.forEach(add);
    pickFresh(track, unitAuthored(u), 3).slice(0, g.length ? 1 : 2).forEach(add);
  });
  // integrative items for this checkpoint + a wider unit pool, preferring what was seen least recently
  const pool = [...t.questions, ...((CHECK_EXTRA[t.id]||[]).map(fromCompact))];
  pickFresh(track, pool, pool.length).forEach(q=>{ if(chosen.length < N) add(q); });
  if(chosen.length < N){
    const wide = []; units.forEach(u=>wide.push(...unitAuthored(u)));
    pickFresh(track, wide, wide.length).forEach(q=>{ if(chosen.length < N) add(q); });
  }
  return shuffle(chosen.slice(0, N)).map(shuffleOptions);
}
function bankSize(track, u){ return unitAuthored(u).length + ((GEN[u.id]||[]).length ? '+' : ''); }

/* =========================================================================
   CROSS-DEVICE SYNC (claude.ai: per-user private db doc)
   ========================================================================= */
const SYNCED = { seen:{} };
try{ const s = JSON.parse(localStorage.getItem('lb-seen')||'null'); if(s) SYNCED.seen = s; }catch(e){}
function saveSeen(){ try{ localStorage.setItem('lb-seen', JSON.stringify(SYNCED.seen)); }catch(e){} scheduleSync(); }

const SYNC = { refs:null, status:'local', timer:null, writing:false, again:false, lastSent:{} };
function syncStatusText(){
  return SYNC.status==='synced' ? '☁︎ Progress syncs across your devices' :
         SYNC.status==='syncing' ? '☁︎ Syncing…' :
         SYNC.status==='error' ? '⚠︎ Sync paused, saved on this device' :
         (NSYNC.code ? 'Sync code set' : 'Saved on this device');
}
function paintSyncStatus(){ document.querySelectorAll('.sync-status').forEach(el=>{ el.textContent = syncStatusText(); el.dataset.state = SYNC.status; }); }

function capSeen(m){ const e=Object.entries(m||{}); if(e.length<=600) return m||{}; e.sort((a,b)=>b[1]-a[1]); return Object.fromEntries(e.slice(0,600)); }
/* Cloud layout: data/users/<id>/state (progress + recently seen questions),
   data/users/<id>/vocab-es and vocab-zh (known words, compact). Split keeps every doc small. */
const T0 = Date.UTC(2026,0,1);
function toMin(ms){ return Math.max(1, Math.round(((ms||0)-T0)/60000)); }
function fromMin(m){ return T0 + m*60000; }
function encodeVocab(s){
  s = s||{known:{}}; const m = {}; const kt = s.knownT||{};
  new Set([...Object.keys(s.known||{}), ...Object.keys(kt)]).forEach(k=>{
    const t = toMin(kt[k] || s.t || T0); m[k] = (s.known||{})[k] ? t : -t;
  });
  const out = {v:1, m, t:s.t||0}; if(s.level) out.level=s.level; if(s.sys) out.sys=s.sys; return out;
}
function decodeVocab(d){
  if(!d || d.v!==1) return null; const known={}, knownT={};
  Object.entries(d.m||{}).forEach(([k,v])=>{ if(v>0) known[k]=1; knownT[k]=fromMin(Math.abs(v)); });
  const out = {known, knownT, t:d.t||0}; if(d.level) out.level=d.level; if(d.sys) out.sys=d.sys; return out;
}
function snapshotState(){
  return { v:1, progress:{ es:getProg('es'), zh:getProg('zh') }, seen:{ es:capSeen(SYNCED.seen.es), zh:capSeen(SYNCED.seen.zh) } };
}
function snapshotLocal(){ return { state:snapshotState(), 'vocab-es':encodeVocab(vStore('es')), 'vocab-zh':encodeVocab(vStore('zh')) }; }
function mergeEntry(a,b){
  if(!a) return b; if(!b) return a;
  const newer = (a.t||0) >= (b.t||0) ? a : b, older = newer===a ? b : a;
  const out = Object.assign({}, older, newer);
  out.done = !!(a.done || b.done);
  if('passed' in a || 'passed' in b) out.passed = !!(a.passed || b.passed);
  if(a.score!=null || b.score!=null) out.score = Math.max(a.score||0, b.score||0);
  if(a.best!=null || b.best!=null) out.best = Math.max(a.best||0, b.best||0);
  if(a.attempts!=null || b.attempts!=null) out.attempts = Math.max(a.attempts||0, b.attempts||0);
  return out;
}
function mergeProg(a,b){ const out={}; new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(k=>{ out[k]=mergeEntry((a||{})[k],(b||{})[k]); }); return out; }
function mergeVocab(a,b){
  a=a||{known:{}}; b=b||{known:{}};
  const ta=a.knownT||{}, tb=b.knownT||{}; const known={}, knownT={};
  new Set([...Object.keys(a.known||{}),...Object.keys(b.known||{}),...Object.keys(ta),...Object.keys(tb)]).forEach(k=>{
    const A=(ta[k]||0), B=(tb[k]||0);
    const src = Math.abs(A-B) < 60000 ? ((a.known||{})[k]||(b.known||{})[k] ? 1 : 0) : (A>B ? ((a.known||{})[k]?1:0) : ((b.known||{})[k]?1:0));
    if(src) known[k]=1; if(A||B) knownT[k]=Math.max(A,B);
  });
  const pref = (a.t||0) >= (b.t||0) ? a : b;
  const out = {known, knownT, t:Math.max(a.t||0,b.t||0)};
  if(pref.level||a.level||b.level) out.level = pref.level||a.level||b.level;
  if(pref.sys||a.sys||b.sys) out.sys = pref.sys||a.sys||b.sys;
  return out;
}
function mergeSeen(a,b){ const out=Object.assign({}, a||{}); Object.entries(b||{}).forEach(([k,v])=>{ if(!out[k] || out[k]<v) out[k]=v; }); return out; }
function applyRemote(name, remote){
  if(!remote) return false;
  remote = JSON.parse(JSON.stringify(remote)); delete remote.updatedAt;
  if(name==='state'){
    if(remote.v!==1) return false;
    const before = JSON.stringify(snapshotState());
    ['es','zh'].forEach(tk=>{
      progressCache[tk] = mergeProg(getProg(tk), remote.progress && remote.progress[tk]);
      try{ localStorage.setItem(TRACKS[tk].progressKey, JSON.stringify(progressCache[tk])); }catch(e){}
      SYNCED.seen[tk] = mergeSeen(SYNCED.seen[tk], remote.seen && remote.seen[tk]);
    });
    try{ localStorage.setItem('lb-seen', JSON.stringify(SYNCED.seen)); }catch(e){}
    return JSON.stringify(snapshotState()) !== before;
  }
  const tk = name==='vocab-es' ? 'es' : 'zh';
  const dec = decodeVocab(remote); if(!dec) return false;
  const before = JSON.stringify(encodeVocab(vStore(tk)));
  vocabStores[tk] = mergeVocab(vStore(tk), dec);
  try{ localStorage.setItem(vocabStoreKey(tk), JSON.stringify(vocabStores[tk])); }catch(e){}
  return JSON.stringify(encodeVocab(vStore(tk))) !== before;
}
const SYNC_DOCS = ['state','vocab-es','vocab-zh'];
function scheduleSync(){
  if(!SYNC.refs) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(pushSync, 1200);
}
async function pushSync(){
  if(!SYNC.refs) return;
  if(SYNC.writing){ SYNC.again = true; return; }
  const snap = snapshotLocal();
  const todo = SYNC_DOCS.filter(n=>JSON.stringify(snap[n]) !== SYNC.lastSent[n]);
  if(!todo.length) return;
  SYNC.writing = true; SYNC.status='syncing'; paintSyncStatus();
  let failed = false, retry = false;
  for(const n of todo){
    const json = JSON.stringify(snap[n]);
    try{ await SYNC.refs[n].set(Object.assign({}, snap[n], {updatedAt: Date.now()})); SYNC.lastSent[n] = json; }
    catch(e){ failed = true; if(e && e.code==='unavailable') retry = true; }
  }
  SYNC.status = failed ? (retry ? 'syncing' : 'error') : 'synced';
  if(retry) setTimeout(scheduleSync, 1500 + Math.random()*1500);
  SYNC.writing = false; paintSyncStatus();
  if(SYNC.again){ SYNC.again=false; scheduleSync(); }
}
function refreshAfterRemote(){
  // only redraw views that hold no in-progress input
  if(state.view==='landing' || !state.track) renderLanding();
  else if(state.view==='home') renderHome();
  if(state.track) renderNav();
  paintSyncStatus();
}
async function initSync(){
  if(!(window.claude && typeof window.claude.use === 'function')) return;
  let db=null, user=null;
  try{ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){ return; }
  if(!db || !user) return;
  let uid=null; try{ uid = await user.id(); }catch(e){}
  if(!uid) return;
  const refs = {};
  try{ SYNC_DOCS.forEach(n=>{ refs[n] = db.doc('data/users/'+uid+'/'+n); }); }catch(e){ return; }
  SYNC.status='syncing'; paintSyncStatus();
  try{
    const snaps = await Promise.all(SYNC_DOCS.map(n=>refs[n].get()));
    let changed = false;
    snaps.forEach((s,i)=>{ if(s && s.exists && applyRemote(SYNC_DOCS[i], s.data())) changed = true; });
    if(changed) refreshAfterRemote();
    SYNC.refs = refs; SYNC.status='synced';
    await pushSync();
  }catch(e){ SYNC.refs = SYNC.refs || refs; SYNC.status='error'; }
  paintSyncStatus();
  SYNC_DOCS.forEach(n=>{
    try{
      refs[n].onSnapshot(snap=>{
        if(!snap || !snap.exists || snap.metadata.hasPendingWrites) return;
        const d = snap.data(); if(!d) return;
        const copy = Object.assign({}, d); delete copy.updatedAt;
        if(JSON.stringify(copy) === SYNC.lastSent[n]) return;
        if(applyRemote(n, d)){ refreshAfterRemote(); scheduleSync(); }
      }, err=>{ SYNC.status='error'; paintSyncStatus(); });
    }catch(e){}
  });
}

/* =========================================================================
   NETLIFY SYNC: progress travels between devices with a private sync code
   ========================================================================= */
const NSYNC = { code:null, poll:null };
try{ NSYNC.code = localStorage.getItem('lb-sync-code'); }catch(e){}
const SYNC_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genSyncCode(){
  const a = new Uint32Array(12); crypto.getRandomValues(a);
  const s = Array.from(a, x=>SYNC_ALPHA[x % SYNC_ALPHA.length]).join('');
  return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8,12);
}
function normalizeSyncCode(raw){
  const s = String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  return s.length===12 ? s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8,12) : null;
}
async function syncCall(payload){
  let res;
  try{ res = await fetch('/.netlify/functions/sync', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); }
  catch(e){ const err = new Error('network'); err.code='unavailable'; throw err; }
  let data=null; try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const err = new Error((data&&data.error)||('http_'+res.status)); if(res.status>=500) err.code='unavailable'; throw err; }
  return data;
}
function makeNetlifyRefs(code){
  const r = {};
  SYNC_DOCS.forEach(n=>{ r[n] = { set: d=>syncCall({code, op:'put', name:n, data:d}) }; });
  return r;
}
async function pullNetlify(){
  if(!NSYNC.code || !SYNC.refs) return;
  try{
    const res = await syncCall({code:NSYNC.code, op:'get'});
    let changed = false;
    SYNC_DOCS.forEach(n=>{
      const d = res && res.docs && res.docs[n]; if(!d) return;
      const copy = Object.assign({}, d); delete copy.updatedAt;
      const json = JSON.stringify(copy);
      if(json === SYNC.lastSent[n]) return;
      if(applyRemote(n, d)) changed = true;
      SYNC.lastSent[n] = json; // what the cloud holds now; pushSync sends anything this device adds on top
    });
    if(changed) refreshAfterRemote();
    SYNC.status = 'synced';
    await pushSync();
  }catch(e){ SYNC.status = 'error'; }
  paintSyncStatus();
}
function startNetlifySync(code){
  NSYNC.code = code;
  try{ localStorage.setItem('lb-sync-code', code); }catch(e){}
  SYNC.refs = makeNetlifyRefs(code); SYNC.lastSent = {};
  SYNC.status = 'syncing'; paintSyncStatus();
  clearInterval(NSYNC.poll);
  NSYNC.poll = setInterval(()=>{ if(document.visibilityState==='visible') pullNetlify(); }, 30000);
  return pullNetlify();
}
function stopNetlifySync(){
  clearInterval(NSYNC.poll); NSYNC.poll=null; NSYNC.code=null;
  try{ localStorage.removeItem('lb-sync-code'); }catch(e){}
  SYNC.refs = null; SYNC.lastSent = {}; SYNC.status = 'local'; paintSyncStatus();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pullNetlify(); });
window.addEventListener('focus', ()=>pullNetlify());

      <p class="sync-or">Already have a code from another device?</p>
      <div class="sync-row"><input id="syncInput" class="sync-input" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="secondary-btn" id="syncJoin">Connect</button></div>
      <p class="sync-small" id="syncMsg">${msg?escHtml(msg):''}</p>
      <div class="sync-row"><button class="secondary-btn" id="syncClose">Close</button></div>
    </div>`;
  document.body.appendChild(m);
  const $ = id=>document.getElementById(id);
  $('syncClose').onclick = closeSyncPanel;
  if(code){
    $('syncCopy').onclick = async ()=>{ try{ await navigator.clipboard.writeText(code); $('syncCopy').textContent='Copied'; }catch(e){ $('syncCopy').textContent=code; } };
    $('syncNow').onclick = async ()=>{ $('syncNow').textContent='Syncing…'; await pullNetlify(); openSyncPanel(); };
    $('syncStop').onclick = ()=>{ stopNetlifySync(); openSyncPanel('Stopped. Your progress is still saved on this device.'); };
  } else {
    $('syncCreate').onclick = async ()=>{ $('syncCreate').textContent='Creating…'; await startNetlifySync(genSyncCode()); openSyncPanel(); };
    $('syncJoin').onclick = async ()=>{
      const c = normalizeSyncCode($('syncInput').value);
      if(!c){ $('syncMsg').textContent = 'Codes have 12 letters and numbers, like ABCD-EFGH-JKMN.'; return; }
      $('syncJoin').textContent='Connecting…';
      await startNetlifySync(c);
      if(SYNC.status==='error'){ stopNetlifySync(); openSyncPanel('Could not reach the sync service. Check your connection and try again.'); return; }
      openSyncPanel();
    };
  }
}
function initNetlifySync(){
  document.querySelectorAll('[data-open-sync]').forEach(b=>{ b.onclick = ()=>openSyncPanel(); });
  if(NSYNC.code) startNetlifySync(NSYNC.code); else paintSyncStatus();
}

function buildChatRules(track, level, topicId){
  const cfg = TRACKS[track];
  const topicLabel = (cfg.chat.topics.find(t=>t.id===topicId)||cfg.chat.topics[0]).label;
  const langName = track==='zh' ? 'Mandarin Chinese' : 'Spanish';
  const guidance = (LEVEL_GUIDANCE[track] && LEVEL_GUIDANCE[track][level]) || '';
  const correctionSpec = track==='zh'
    ? 'Write the correction as: the corrected Chinese, its pinyin in parentheses, then a one-line English explanation. Example: "连你都不知道吗？(lián nǐ dōu bù zhīdào ma?) — 连...都... needs 都 after the noun, not before."'
    : 'Write the correction in simple Spanish, or brief Spanish plus a short English aside, citing the phrase with the error, the correct form, and a one-line reason.';
  return `You are a conversation partner for a student studying ${langName}, currently at level ${level}. Your only job is to hold a natural conversation in ${langName} and, when needed, correct gently.

${guidance}

Conversation topic: ${topicLabel}. Stay within this topic, but naturally — ask genuine follow-up questions.

Rules:
- Always reply in ${langName}, never in English, in the "reply" field.
- Be warm, curious, and natural, like a real person chatting, not a teacher giving a lesson.
- Keep your turns short: two or three sentences at most, plus a follow-up question when it makes sense.
- Review the student's last message. If it has grammar, conjugation, agreement, or spelling errors worth flagging for their level, write a short, kind correction in the "correction" field. ${correctionSpec} If there's nothing worth flagging, or this is the first message of the conversation, set "correction" to null.
- Don't nitpick trivial accent-mark slips if the rest of the message is clearly understood; focus on errors an examiner would actually flag.

Reply with ONLY a valid JSON object, no text outside the JSON, no code fences, in exactly this shape:
{"reply": "your reply in the target language", "correction": "short correction or null"}`;
}

function buildDefineRules(track, word, sentence){
  if(track==='zh'){
    return `You are a compact Mandarin Chinese dictionary. Given a character or word and the sentence it appeared in, return ONLY a valid JSON object, no text outside it, no code fences, in exactly this shape:
{"translation": "short English meaning", "reading": "pinyin with tone marks", "note": "one short line on nuance or usage in this sentence, in English"}

Character/word: ${word}
Sentence: ${sentence}`;
  }
  return `You are a compact Spanish dictionary. Given a word and the sentence it appeared in, return ONLY a valid JSON object, no text outside it, no code fences, in exactly this shape:
{"translation": "short English meaning", "reading": null, "note": "one short line on nuance or usage in this sentence, in English (e.g. verb tense, false-friend warning, regional note)"}

Word: ${word}
Sentence: ${sentence}`;
}

function tokenizeForTap(track, text){
  if(track==='zh'){
    const tokens = [];
    for(const ch of text){
      if(/[\u4e00-\u9fff]/.test(ch)) tokens.push({text:ch, word:ch});
      else tokens.push({text:ch, word:null});
    }
    return tokens;
  }
  return text.split(/(\s+)/).map(chunk=>{
    if(/^\s+$/.test(chunk) || chunk==='') return {text:chunk, word:null};
    const clean = chunk.replace(/^[¿¡"'“”(]+|[.,;:!?"'”)]+$/g,'');
    return {text:chunk, word: clean.length ? clean : null};
  });
}

function loadProgress(track){
  try{ return JSON.parse(localStorage.getItem(TRACKS[track].progressKey)||'{}'); }
  catch(e){ return {}; }
}
function saveProgress(track, p){ try{ localStorage.setItem(TRACKS[track].progressKey, JSON.stringify(p)); }catch(e){} scheduleSync(); }
let progressCache = {};
function getProg(track){ if(!progressCache[track]) progressCache[track] = loadProgress(track); return progressCache[track]; }

function isUnitDone(track, id){ const p=getProg(track); return !!(p[id] && p[id].done); }
function saveUnitResult(track, id, score, total, passed){
  const p=getProg(track); const prev=p[id]||{};
  p[id]={done: !!(prev.done||passed), best: Math.max(prev.best||0, score), last: score, total, attempts:(prev.attempts||0)+1, t: Date.now()};
  saveProgress(track,p);
}
function getTestResult(track, id){ return getProg(track)[id] || null; }
function saveTestResult(track, id, score, total, passed){
  const p=getProg(track); const prev=p[id]||{};
  p[id]={score: Math.max(prev.score||0, score), last: score, total, passed: !!(prev.passed||passed), done:true, attempts:(prev.attempts||0)+1, t: Date.now()};
  saveProgress(track,p);
}

function overallPct(track){
  const cfg = TRACKS[track];
  const totalItems = cfg.units.length + cfg.tests.length;
  let done = 0;
  cfg.units.forEach(u=>{ if(isUnitDone(track,u.id)) done++; });
  cfg.tests.forEach(t=>{ const r=getTestResult(track,t.id); if(r && r.passed) done++; });
  return Math.round((done/totalItems)*100);
}

function progressRing(pct, colorClass){
  const r = 30, c = 2*Math.PI*r;
  const offset = c * (1 - pct/100);
  return `<svg width="72" height="72" viewBox="0 0 72 72" class="ring-svg ${colorClass}">
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--paper-deep)" stroke-width="7"/>
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 36 36)"/>
  </svg>`;
}

    el.onclick = ()=>{
      const track = el.dataset.justChat;
      state.track = track;
      navigate('chat:'+defaultChatLevel(track));
    };
  });

function levelLabel(track,l){ return TRACKS[track].levelLabel(l); }
function firstUnstartedUnit(track){
  const cfg = TRACKS[track];
  const u = cfg.units.find(u=>!isUnitDone(track,u.id));
  return u ? u.id : cfg.units[0].id;
}
function defaultChatLevel(track){
  const cfg = TRACKS[track];
  for(const lv of cfg.levels){
    const us = cfg.units.filter(u=>u.level===lv);
    if(us.length && !us.every(u=>isUnitDone(track,u.id))) return lv;
  }
  return cfg.levels[cfg.levels.length-1];
}

function conjugateRegular(inf, group, tenseKey){
  if(tenseKey==='fut')  return FUT_ENDINGS.map(e=>inf+e);
  if(tenseKey==='cond') return COND_ENDINGS.map(e=>inf+e);
  const stem = inf.slice(0,-2);
  return REGULAR_ENDINGS[tenseKey][group].map(e=>stem+e);
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// Builds a flat pool of {inf, en, forms:[6 forms for the chosen tense]} for
// whichever verb-type chips are selected.
function buildConjPool(tenseKey, typeKeys){
  const wantAll = typeKeys.includes('all');
  const pool = [];
  ['ar','er','ir'].forEach(group=>{
    if(wantAll || typeKeys.includes(group)){
      REGULAR_VERBS[group].forEach(v=>{
        pool.push({ inf:v.inf, en:v.en, forms:conjugateRegular(v.inf, group, tenseKey) });
      });
    }
  });
  if(wantAll || typeKeys.includes('stem')){
    Object.keys(STEM_VERBS).forEach(inf=>{
      pool.push({ inf, en:STEM_VERBS[inf].en, forms:STEM_VERBS[inf].forms[tenseKey] });
    });
  }
  if(wantAll || typeKeys.includes('irr')){
    Object.keys(IRREGULAR_VERBS).forEach(inf=>{
      pool.push({ inf, en:IRREGULAR_VERBS[inf].en, forms:IRREGULAR_VERBS[inf].forms[tenseKey] });
    });
  }
  return pool;
}

function generateConjQuestions(tenseKey, typeKeys, count){
  const pool = buildConjPool(tenseKey, typeKeys);
  if(!pool.length) return [];
  const pairs = [];
  pool.forEach((v,vi)=>{ for(let pi=0; pi<6; pi++) pairs.push([vi,pi]); });
  let picked = shuffleArr(pairs);
  while(picked.length < count) picked = picked.concat(shuffleArr(pairs));
  picked = picked.slice(0, count);
  return picked.map(([vi,pi])=>{
    const v = pool[vi];
    const correct = v.forms[pi];
    const otherIdx = shuffleArr([0,1,2,3,4,5].filter(x=>x!==pi)).slice(0,3);
    const options = shuffleArr([correct, ...otherIdx.map(i=>v.forms[i])]);
    return {
      inf: v.inf, en: v.en, pronounIdx: pi, tenseKey,
      options, correct: options.indexOf(correct),
      explain: `${v.inf} (${v.en}) — ${CONJ_PRONOUNS[pi]}: ${correct}`,
    };
  });
}

function renderConjDrill(){
  const track = state.track;
  applyTrackChrome(track);
  const total = state.conjQuestions.length;
  const tenseLabel = CONJ_TENSES.find(t=>t.key===state.conjTense).label;
  if(state.qIndex >= total){
    const correctCount = state.answers.filter(a=>a.correct).length;
    root.innerHTML = `
    <div class="view">
      <div class="result-hero">
        <div class="result-score">${correctCount}/${total}</div>
        <div class="result-verdict ${correctCount/total>=0.7?'pass':'fail'}">${tenseLabel} — ${Math.round(correctCount/total*100)}%</div>
      </div>
      <div style="display:flex;gap:.7rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;">
        <button class="secondary-btn" id="conjRetryBtn">Practicar de nuevo</button>
        <button class="secondary-btn" data-nav="conj:setup">Cambiar ajustes</button>
        <button class="primary-btn" data-nav="track:${track}">Volver al mapa</button>
      </div>
    </div>`;
    document.getElementById('conjRetryBtn').addEventListener('click', ()=>{
      const questions = generateConjQuestions(conjPrefs.tense, conjPrefs.types, conjPrefs.count);
      state = { track, view:'conjDrill', conjQuestions:questions, conjTense:conjPrefs.tense, qIndex:0, answers:[] };
      render();
    });
    attachNavHandlers();
    return;
  }
  const q = state.conjQuestions[state.qIndex];
  root.innerHTML = `
  <div class="view">
    <div class="crumb"><button data-nav="conj:setup">Conjugation Drills</button> <span>›</span> <span>${tenseLabel}</span></div>
    <div class="progress-line"><div class="bar"><i style="width:${(state.qIndex/total)*100}%"></i></div><span>${state.qIndex+1} / ${total}</span></div>
    <div class="q-card">
      <div class="q-prompt">
        Conjuga <span class="conj-verb-tag">${q.inf}</span> — <span class="conj-pronoun-tag">${CONJ_PRONOUNS[q.pronounIdx]}</span>
        <div class="conj-en-hint">${q.en} · ${tenseLabel}</div>
      </div>
      <div id="optsWrap"></div>
      <div id="explainWrap"></div>
      <div class="q-nav"><span></span><button class="primary-btn" id="nextBtn" style="display:none;">Siguiente →</button></div>
    </div>
  </div>`;
  const optsWrap = document.getElementById('optsWrap');
  q.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = opt;
    b.addEventListener('click', ()=>{
      if(b.dataset.locked) return;
      [...optsWrap.children].forEach(c=>{c.dataset.locked='1'; c.disabled=true;});
      const isCorrect = i===q.correct;
      b.classList.add(isCorrect?'correct':'incorrect');
      if(!isCorrect) optsWrap.children[q.correct].classList.add('correct');
      document.getElementById('explainWrap').innerHTML = `<div class="explain ${isCorrect?'ok':'no'}">${isCorrect?'✓ Correcto. ':'✗ No exactamente. '}${q.explain}</div>`;
      document.getElementById('nextBtn').style.display='inline-block';
      state.answers.push({correct:isCorrect});
    });
    optsWrap.appendChild(b);
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ state.qIndex++; renderConjDrill(); });
  attachNavHandlers();
}

  const cfg = TRACKS[track];
  document.documentElement.style.setProperty('--track-color', cfg.color);
  document.getElementById('sidebar').dataset.track = track;
  document.getElementById('topbar').dataset.track = track;
  const brand = document.getElementById('brandName');

  brand.className = track==='zh' ? 'zh' : '';
  document.getElementById('brandSub').textContent = cfg.homeSub;
  document.getElementById('topbarName').textContent = cfg.homeTitle;
  document.getElementById('chatNavLabel').textContent = cfg.chat.navLabel;
  document.getElementById('vocabNavLabel').textContent = VOCAB_CFG[track].navLabel;
}

function renderNav(){
  if(!state.track) return;
  const track = state.track; const cfg = TRACKS[track];
  applyTrackChrome(track);
  const groups = {};
  cfg.levels.forEach(l=>groups[l]=[]);
  cfg.units.forEach(u=>groups[u.level].push(u));
  let html = '';
  cfg.levels.forEach(level=>{
    html += `<div class="level-group"><h4>${levelLabel(track,level)}</h4>`;
    groups[level].forEach(u=>{
      const active = state.view==='unit' && state.unitId===u.id;
      const done = isUnitDone(track,u.id);
      html += `<button class="nav-item ${active?'active':''} ${done?'done':''}" data-nav="unit:${u.id}">
        <span class="dot"></span><span>${u.num}. ${u.title}</span>
      </button>`;
    });
    const lastNum = groups[level][groups[level].length-1].num;
    const test = cfg.tests.find(t=> t.afterUnit === lastNum);
    if(test){
      const r = getTestResult(track,test.id);
      const activeT = state.view==='test' && state.testId===test.id;
      html += `<button class="nav-item test ${r&&r.passed?'passed':''} ${activeT?'active':''}" data-nav="test:${test.id}">
        <span class="dot">🏁</span><span>${test.title}${r?(r.passed?' ✓':` (${r.score}/${r.total})`):''}</span>
      </button>`;
    }
    html += `</div>`;
  });
  if(track==='es'){
    const activeConj = state.view==='conjSetup' || state.view==='conjDrill';
    html += `<div class="level-group conj-nav-wrap"><button class="nav-item conj-nav ${activeConj?'active':''}" data-nav="conj:setup">
      <span class="dot">🎯</span><span>Conjugation Drills</span>
    </button></div>`;
  }
  navList.innerHTML = html;
  document.getElementById('overallBar').style.width = overallPct(track)+'%';
  document.getElementById('overallText').textContent = overallPct(track)+'% completado / complete';
  document.getElementById('chatNavBtn').classList.toggle('active', state.view==='chat');
  document.getElementById('vocabNavBtn').classList.toggle('active', state.view==='vocab');
}

function navigate(target){
  const [type,id] = target.split(':');
  if(type==='landing'){ state = {track:null, view:'landing'}; render(); return; }
  if(type==='track'){ state = {track:id, view:'home'}; render(); document.getElementById('main').scrollTo(0,0); return; }
  if(type==='unit'){ state = {track:state.track, view:'unit', unitId:id, mode:'lesson', cardIndex:0, qIndex:0, answers:[]}; }
  if(type==='practice'){ const uu=TRACKS[state.track].units.find(x=>x.id===id); state = {track:state.track, view:'unit', unitId:id, mode:'practice', cardIndex:0, qIndex:0, answers:[], quiz: buildUnitQuiz(state.track, uu)}; }
  if(type==='test'){ const tt=TRACKS[state.track].tests.find(x=>x.id===id); state = {track:state.track, view:'test', testId:id, qIndex:0, answers:[], quiz: buildCheckpoint(state.track, tt)}; }
  if(type==='vocab'){ state = {track:state.track, view:'vocab'}; }
  if(type==='conj'){ state = {track:state.track, view:'conjSetup'}; }
  if(type==='chat'){
    const level = id || defaultChatLevel(state.track);
    state = {track:state.track, view:'chat', level, topic:'general', messages:[], sending:false, blocked:false};
  }
  render();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('main').scrollTo(0,0);
}
